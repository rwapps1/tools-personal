<!DOCTYPE html>
<html lang="en">
<head>

<style>html{visibility:hidden}</style>
<script type="module" src="./auth-guard.js"></script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Run Results</title>
<style>
  :root {
    --white: #ffffff;
    --orange: #FF6600;
    --black: #1a1a1a;
    --pink: #E6007E;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--white);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  h1 {
    color: var(--black);
    font-size: 2.4rem;
    margin: 0 0 8px 0;
    text-align: center;
  }

  .underline {
    width: 90px;
    height: 5px;
    background: var(--pink);
    border-radius: 3px;
    margin-bottom: 40px;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px;
    max-width: 800px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    width: 170px;
    padding: 24px 16px;
    border-radius: 16px;
    background: var(--white);
    border: 2px solid var(--black);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    border-color: var(--pink);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }

  .icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    border: 3px solid var(--black);
  }

  .card:hover .icon {
    background: var(--pink);
  }

  .name {
    text-align: center;
    font-weight: 600;
    color: var(--black);
    font-size: 0.95rem;
    line-height: 1.3;
  }
</style>
</head>
<body>

  <h1>Park Run Results</h1>
  <div class="underline"></div>

  <div class="grid">
    <a class="card" href="https://www.parkrun.org.uk/parkrunner/4955037/all/" target="_blank" rel="noopener noreferrer">
      <div class="icon">RW</div>
      <div class="name">Robert Wells</div>
    </a>

    <a class="card" href="https://www.parkrun.org.uk/parkrunner/2450213/all/" target="_blank" rel="noopener noreferrer">
      <div class="icon">RD</div>
      <div class="name">Robert Dickinson</div>
    </a>

    <a class="card" href="https://www.parkrun.org.uk/parkrunner/2681210/all/" target="_blank" rel="noopener noreferrer">
      <div class="icon">SW</div>
      <div class="name">Stephanie Winter</div>
    </a>

    <a class="card" href="https://www.parkrun.org.uk/parkrunner/440369/all/" target="_blank" rel="noopener noreferrer">
      <div class="icon">NH</div>
      <div class="name">Neil Hodgson</div>
    </a>

<a class="card" href="https://www.parkrun.org.uk/parkrunner/12062043/all/" target="_blank" rel="noopener noreferrer">
      <div class="icon">WF</div>
      <div class="name">Will Fenoughty</div>
    </a>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Base</title>
<style>
:root{--bg:#f4f5fb;--sf:#fff;--tx:#1a1b25;--mu:#68697c;--bd:#e2e3f0;--ac:#5b5bf0;--ac2:#22c1c3;--acg:linear-gradient(135deg,#6a5bf5,#22c1c3);--onac:#fff;--dn:#e0304a;--hv:#f0f0fb;--chip:#ecebfb;--ov:rgba(20,18,40,.5);--sh:0 1px 2px rgba(30,20,80,.04),0 6px 18px rgba(30,20,80,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#121320;--sf:#1a1c2c;--tx:#eceafd;--mu:#9d9dbd;--bd:#2d2f47;--ac:#8b85ff;--ac2:#37e0da;--acg:linear-gradient(135deg,#8b7bff,#37c9da);--onac:#12111f;--dn:#ff6b81;--hv:#232544;--chip:#262a48;--ov:rgba(6,6,16,.65);--sh:0 1px 2px rgba(0,0,0,.2),0 10px 26px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:10px 10px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.hdr h1{flex:1;margin:0;padding-left:6px;font-size:18px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:0;color:var(--mu);width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;transition:background .15s,color .15s,transform .1s}
.ib:hover{background:var(--hv);color:var(--tx)}
.ib:active{transform:scale(.92)}
.ib[disabled]{opacity:.3;cursor:default}
.ib.pri{background:var(--acg);color:var(--onac);box-shadow:0 3px 10px -3px color-mix(in srgb,var(--ac) 70%,transparent)}
.ib.pri:hover{filter:brightness(1.06)}
.btn{font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .1s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acg);color:var(--onac);border-color:transparent;box-shadow:0 4px 14px -4px color-mix(in srgb,var(--ac) 65%,transparent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dn{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 40%,var(--bd))}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:64px}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
.list{background:var(--sf);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.rec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px;font:inherit;color:inherit;cursor:pointer;transition:background .12s}
.rec:last-child{border-bottom:0}
.rec:hover{background:var(--hv)}
.rec .m{flex:1;min-width:0}
.rec .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:600;background:var(--chip);color:var(--ac);padding:3px 9px;border-radius:99px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.sortrow{display:flex;gap:8px}
.sortrow select{flex:1}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search input{padding-left:34px}
.meta{padding:2px 14px 8px;font-size:12.5px;color:var(--mu);font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--mu)}
.empty h2{color:var(--tx);font-size:17px;margin:0 0 6px}
.empty p{margin:0 0 10px}
.empty .btn{margin:4px}
.warn{margin:10px 12px 0;padding:8px 10px;border:1px solid var(--dn);color:var(--dn);border-radius:10px;font-size:13px}
.overlay{position:fixed;inset:0;z-index:20;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.closing{display:none}
.sheet{background:var(--sf);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:var(--sh)}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:86vh}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 8px 18px;border-bottom:1px solid var(--bd)}
.sh-head h2{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.sh-body{padding:14px 18px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.sh-foot .sp{flex:1}
.fld{margin-bottom:12px}
.fld>label,.lab{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-bottom:4px}
.req{color:var(--dn)}
.err{color:var(--dn);font-size:12.5px;margin-top:3px}
.err:empty{display:none}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx)}
.hint{font-size:12.5px;color:var(--mu);margin:10px 0 0}
.revlinks{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)}
.revgroup{margin-bottom:10px}
.revgroup:last-child{margin-bottom:0}
.revgroup .lab{margin-bottom:6px}
.revrow{border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;transition:border-color .15s,box-shadow .15s}
.revrow:last-child{margin-bottom:0}
.revrow:hover{border-color:var(--ac)}
.linkpick{position:relative}
.lpmenu{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:2;background:var(--sf);border:1px solid var(--bd);border-radius:10px;max-height:180px;overflow:auto;box-shadow:var(--sh)}
.lpopt{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;font:inherit;font-size:14px;color:var(--tx);cursor:pointer}
.lpopt:hover{background:var(--hv)}
.lpempty{padding:8px 10px;font-size:13px;color:var(--mu)}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 12px}
.qtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px 10px;font:inherit;color:var(--tx);cursor:pointer;text-align:center;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,border-color .12s}
.qtile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.qtile:active{transform:scale(.97) translateY(0)}
.qtile .qic{width:44px;height:44px;border-radius:50%;background:var(--acg);display:flex;align-items:center;justify-content:center;color:var(--onac);box-shadow:0 4px 12px -3px color-mix(in srgb,var(--ac) 60%,transparent)}
.qtile.edit .qic{background:var(--chip);color:var(--ac);box-shadow:none}
.qtile .qlab{font-size:13.5px;font-weight:600}
.qrow{padding:0 12px 4px}
.qrow .btn{width:100%}
.frow{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--sf)}
.fr1{display:flex;gap:2px;align-items:center;margin-bottom:6px}
.fr1 .fn{flex:1}
.fr2{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.fr2 select{flex:1}
.fr2 .chk{white-space:nowrap;font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{justify-content:flex-start;padding:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;margin:10px 12px;padding:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:12.5px;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.rowbtns{display:flex;gap:8px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:500;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);cursor:pointer;transition:.12s}
.chip.on{background:var(--acg);color:var(--onac);border-color:transparent}
.flt{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;margin-bottom:10px;align-items:center}
.flt .fvw{grid-column:1 / 3}
.tblwrap{margin:0 12px;overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--sf);box-shadow:var(--sh)}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th{background:var(--chip);color:var(--ac);text-align:left;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.02em}
table.rt th,table.rt td{padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.rt tr:last-child td{border-bottom:0}
table.rt td.num{text-align:right;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;padding:12px}
.actions .btn{flex:1}
.viewgroup{margin-bottom:16px}
.viewgroup:last-child{margin-bottom:0}
.viewgroup h4{margin:0 0 6px;font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.viewrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;color:inherit;cursor:pointer;margin-bottom:6px;transition:border-color .12s,transform .1s}
.viewrow:last-child{margin-bottom:0}
.viewrow:hover{border-color:var(--ac);transform:translateX(2px)}
.viewrow .vic{width:32px;height:32px;border-radius:9px;background:var(--chip);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.viewrow .m{flex:1;min-width:0}
.viewrow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewrow .s{font-size:12px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--acg);color:var(--onac);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#toast.on{opacity:1;transform:translateX(-50%)}
#printArea{display:none}
@page{margin:14mm}
@media print{
body{background:#fff;color:#000}
body>*:not(#printArea){display:none!important}
#printArea{display:block;font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000}
#printArea h1{font-size:18px;margin:0 0 2px}
#printArea p{margin:0 0 12px;color:#444}
#printArea table{border-collapse:collapse;width:100%}
#printArea th{background:#e6e6e6;color:#000;text-align:left}
#printArea th,#printArea td{border:1px solid #bbb;padding:4px 6px;vertical-align:top}
#printArea tr{page-break-inside:avoid}
#printArea thead{display:table-header-group}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>
<div id="printArea"></div>
<input type="file" id="impf" accept="application/json,.json" hidden>
<script>
'use strict';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isEmpty=v=>v===undefined||v===null||v==='';

const ICON={
plus:'<path d="M12 5v14M5 12h14"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
x:'<path d="M18 6L6 18M6 6l12 12"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
up:'<path d="M18 15l-6-6-6 6"/>',
down:'<path d="M6 9l6 6 6-6"/>',
chev:'<path d="M9 18l6-6-6-6"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
bookmark:'<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'
};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ===== STORAGE LAYER =====
   The only section that touches storage. To move to Firestore later, keep these
   method names and replace the bodies (data stays cached in this.data, writes go
   to Firestore, onSnapshot refreshes the cache and calls render()). */
const Store={
  KEY:'base_db_v1',persistent:true,data:null,
  init(){
    let raw=null;
    try{localStorage.setItem('__base_t','1');localStorage.removeItem('__base_t');raw=localStorage.getItem(this.KEY);}catch(e){this.persistent=false;}
    try{this.data=raw?JSON.parse(raw):null;}catch(e){this.data=null;}
    if(!this.data||!Array.isArray(this.data.tables))this.data={tables:[],records:{},views:{}};
    if(!this.data.records)this.data.records={};
    if(!this.data.views)this.data.views={};
  },
  commit(){try{localStorage.setItem(this.KEY,JSON.stringify(this.data));}catch(e){this.persistent=false;}},
  tables(){return this.data.tables;},
  table(id){return this.data.tables.find(t=>t.id===id);},
  records(tid){return this.data.records[tid]||(this.data.records[tid]=[]);},
  views(tid){return this.data.views[tid]||(this.data.views[tid]=[]);},
  saveTable(t){const i=this.data.tables.findIndex(x=>x.id===t.id);if(i>=0)this.data.tables[i]=t;else this.data.tables.push(t);this.commit();},
  deleteTable(id){this.data.tables=this.data.tables.filter(t=>t.id!==id);delete this.data.records[id];delete this.data.views[id];this.commit();},
  saveRecord(tid,r){const a=this.records(tid);const i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);this.commit();},
  deleteRecord(tid,id){this.data.records[tid]=this.records(tid).filter(r=>r.id!==id);this.commit();},
  saveView(tid,v){const a=this.views(tid);const i=a.findIndex(x=>x.id===v.id);if(i>=0)a[i]=v;else a.push(v);this.commit();},
  deleteView(tid,id){this.data.views[tid]=this.views(tid).filter(v=>v.id!==id);this.commit();},
  exportAll(){return JSON.stringify({app:'base',version:1,exported:new Date().toISOString(),tables:this.data.tables,records:this.data.records,views:this.data.views},null,2);},
  importAll(o){this.data={tables:o.tables,records:o.records||{},views:o.views||{}};this.commit();},
  clearAll(){this.data={tables:[],records:{},views:{}};this.commit();}
};

/* ===== helpers ===== */
const TYPES={text:'Text',longtext:'Long text',number:'Number',date:'Date',dropdown:'Dropdown',checkbox:'Tick box',link:'Link to another table',lookup:'Pull in from a link'};
const OPS={
  text:[['contains','contains'],['eq','equals'],['neq','does not equal'],['empty','is empty'],['nempty','is not empty']],
  number:[['eq','='],['neq','\u2260'],['gt','>'],['lt','<'],['gte','\u2265'],['lte','\u2264'],['empty','is empty'],['nempty','is not empty']],
  date:[['eq','on'],['lt','before'],['gt','after'],['empty','is empty'],['nempty','is not empty']],
  dropdown:[['eq','is'],['neq','is not'],['empty','is empty'],['nempty','is not empty']],
  checkbox:[['ticked','is ticked'],['unticked','is not ticked']]
};
OPS.longtext=OPS.text;
OPS.link=[['eq','is'],['neq','is not'],['empty','is empty'],['nempty','is not empty']];
OPS.lookup=[['contains','contains'],['eq','equals'],['neq','does not equal'],['gt','>'],['lt','<'],['empty','is empty'],['nempty','is not empty']];
const noVal=op=>['empty','nempty','ticked','unticked'].includes(op);

/* Fields on a table that make sense as (a) search targets in a link picker, or
   (b) the source of a Lookup field: anything with a plain scalar value. Link and
   lookup fields are excluded from the lookup source list (no chaining), but link
   fields ARE searchable (their resolved display text is included). */
function textSearchFields(t){return t.fields.filter(f=>f.type!=='checkbox');}
function lookupSourceFields(t){return t.fields.filter(f=>f.type!=='link'&&f.type!=='lookup'&&f.type!=='checkbox');}

/* Link fields store the linked record's id in v[f.id]. linkLabel resolves it to
   display text (the linked table's first field), or '(deleted)' if the target
   record no longer exists, or '' if unset / the target table itself is gone. */
function linkLabel(f,id){
  if(isEmpty(id))return '';
  const lt=Store.table(f.linkTable);
  if(!lt)return '(deleted)';
  const lr=Store.records(lt.id).find(r=>r.id===id);
  if(!lr)return '(deleted)';
  return fmt(lt.fields[0],lr.v[lt.fields[0].id])||'Untitled';
}

/* Every field/record pair on the linked table, used to search a link picker
   beyond just the title field (so e.g. surname matches even when the title
   field shown is first name). */
function linkSearchText(lt,lr){
  return textSearchFields(lt).map(f=>fmt(f,lr.v[f.id])).join(' ').toLowerCase();
}

/* Lookup fields snapshot {via, srcField, value, label} at save time (see
   recordModal). They display their stored label/value and don't re-resolve
   live, per the "snapshot at time of sale" behaviour. */
function fmt(f,v,csv){
  if(f.type==='checkbox')return v?'Yes':'No';
  if(f.type==='link')return linkLabel(f,v);
  if(f.type==='lookup'){
    if(!v||isEmpty(v.value))return '';
    if(csv)return String(v.value);
    return v.label!==undefined?v.label:String(v.value);
  }
  if(isEmpty(v))return '';
  if(f.type==='date'){
    if(csv)return String(v);
    const d=new Date(v+'T00:00:00');
    return isNaN(d)?String(v):d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  }
  if(f.type==='number'){
    if(csv)return String(v);
    return Number(v).toLocaleString('en-GB');
  }
  return String(v);
}

/* Finds every table with a Link field pointing at table `tid`, and every record
   in those tables whose link field currently points at record `rid`. Used to
   show a read-only "Linked from X" section on a record so e.g. a Client shows
   its Sales, without needing anything configured on the Client side. */
function reverseLinks(tid,rid){
  const out=[];
  Store.tables().forEach(ot=>{
    if(ot.id===tid)return;
    ot.fields.filter(f=>f.type==='link'&&f.linkTable===tid).forEach(f=>{
      const recs=Store.records(ot.id).filter(r=>r.v[f.id]===rid);
      if(recs.length)out.push({table:ot,field:f,recs:recs});
    });
  });
  return out;
}

/* Computes a lookup field's current snapshot: given the lookup field's config
   (via = id of the link field on this same table, srcField = id of the field
   to copy on the linked table) and that link field's current value (a linked
   record id), returns {value, label} read from the linked record right now,
   or null if there's nothing to copy yet. Stored on the record at save time;
   see the "snapshot at time of sale" behaviour in recordModal. */
function computeLookup(lookupField,linkFieldId,t){
  const viaField=t.fields.find(f=>f.id===lookupField.via);
  if(!viaField||viaField.type!=='link')return null;
  const linkedId=linkFieldId;
  if(isEmpty(linkedId))return null;
  const lt=Store.table(viaField.linkTable);
  if(!lt)return null;
  const lr=Store.records(lt.id).find(r=>r.id===linkedId);
  if(!lr)return null;
  const srcField=lt.fields.find(f=>f.id===lookupField.srcField);
  if(!srcField)return null;
  const raw=lr.v[srcField.id];
  if(isEmpty(raw))return null;
  return{value:raw,label:fmt(srcField,raw)};
}

function match(rec,f,fl){
  let v=rec.v[f.id];
  const op=fl.op,q=fl.value;
  const isLookup=f.type==='lookup';
  if(isLookup)v=v&&!isEmpty(v.value)?v.value:undefined;
  if(op==='empty')return isEmpty(v);
  if(op==='nempty')return !isEmpty(v);
  if(op==='ticked')return !!v;
  if(op==='unticked')return !v;
  if(isEmpty(q))return true;
  if(f.type==='number'||(isLookup&&typeof v==='number'&&(op==='gt'||op==='lt'||op==='eq'||op==='neq'))){
    if(isEmpty(v))return false;
    const a=Number(v),b=Number(q);
    if(f.type==='number')return op==='eq'?a===b:op==='neq'?a!==b:op==='gt'?a>b:op==='lt'?a<b:op==='gte'?a>=b:a<=b;
    return op==='eq'?a===b:op==='neq'?a!==b:op==='gt'?a>b:a<b;
  }
  if(f.type==='date'){
    if(isEmpty(v))return false;
    return op==='eq'?v===q:op==='lt'?v<q:v>q;
  }
  if(f.type==='link'){
    if(isEmpty(v))return false;
    return op==='eq'?v===q:v!==q;
  }
  const a=String(isEmpty(v)?'':v).toLowerCase(),b=String(q).toLowerCase();
  return op==='contains'?a.includes(b):op==='eq'?a===b:a!==b;
}

function sortRecs(list,f,dir){
  if(!f)return list;
  const d=dir==='desc'?-1:1;
  return [...list].sort((a,b)=>{
    let x=a.v[f.id],y=b.v[f.id];
    if(f.type==='lookup'){x=x&&!isEmpty(x.value)?x.value:undefined;y=y&&!isEmpty(y.value)?y.value:undefined;}
    const ex=isEmpty(x)&&f.type!=='checkbox',ey=isEmpty(y)&&f.type!=='checkbox';
    if(ex&&ey)return 0;
    if(ex)return 1;
    if(ey)return -1;
    let r;
    if(f.type==='number'||(f.type==='lookup'&&typeof x==='number'))r=Number(x)-Number(y);
    else if(f.type==='checkbox')r=(x?1:0)-(y?1:0);
    else if(f.type==='link')r=linkLabel(f,x).localeCompare(linkLabel(f,y),'en-GB',{numeric:true,sensitivity:'base'});
    else r=String(x).localeCompare(String(y),'en-GB',{numeric:true,sensitivity:'base'});
    return r*d;
  });
}

function recText(t,r){return textSearchFields(t).map(f=>fmt(f,r.v[f.id])).join(' ').toLowerCase();}

function dl(name,text,mime){
  const b=new Blob([text],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'report';
const today=()=>new Date().toISOString().slice(0,10);

/* Best-effort singular of a table name for the home screen's "Add X"/"Edit X"
   labels, e.g. "Clients"->"client", "Sales"->"sale", "Items"->"item". Only
   handles common English patterns; anything else is left as-is (lowercased) —
   fine for a label, and there's no per-table override to configure. */
function singularize(name){
  // Trailing parenthetical (e.g. "Clients (sample)") isn't part of the noun
  // to singularize; strip it, singularize the rest, then reattach.
  const m=String(name).trim().match(/^(.*\S)\s*(\([^)]*\))\s*$/);
  if(m)return singularize(m[1])+' '+m[2];
  const w=String(name).trim().split(/\s+/).pop()||name;
  const lower=w.toLowerCase();
  let sing;
  if(/ies$/.test(lower))sing=lower.replace(/ies$/,'y');
  else if(/(ses|xes|zes|ches|shes)$/.test(lower))sing=lower.replace(/es$/,'');
  else if(/[^s]s$/.test(lower))sing=lower.replace(/s$/,'');
  else sing=lower;
  const rest=name.trim().split(/\s+/).slice(0,-1).join(' ');
  return (rest?rest+' ':'')+sing;
}

let tt;
function toast(m){
  const el=$('#toast');el.textContent=m;el.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2000);
}

/* ===== routing and modal stack (hardware back closes pop-ups) ===== */
let route={name:'home'};
const modals=[];
let pending=null,noHist=false;

function go(r,replace){
  route=r;
  try{(replace?history.replaceState:history.pushState).call(history,{route:r,d:0},'');}catch(e){}
  render();window.scrollTo(0,0);
}

function openModal(o){
  const el=document.createElement('div');
  el.className='overlay';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="sh-head"><h2>${esc(o.title)}</h2><button class="ib" type="button" data-close aria-label="Close">${ic('x')}</button></div><div class="sh-body">${o.body}</div>${o.foot?`<div class="sh-foot">${o.foot}</div>`:''}</div>`;
  $('#modalRoot').appendChild(el);
  const m={el};
  modals.push(m);
  try{history.pushState({route:route,d:modals.length},'');}catch(e){noHist=true;}
  $('[data-close]',el).onclick=()=>closeN(1);
  if(o.backdrop)el.addEventListener('mousedown',e=>{if(e.target===el&&modals[modals.length-1]===m)closeN(1);});
  if(o.onMount)o.onMount(el,m);
  return m;
}

let pendingSeq=0;
function closeN(n,cb){
  n=Math.min(n,modals.length);
  if(!n){if(cb)cb();return;}
  const target=modals.length-n;
  for(let i=target;i<modals.length;i++)modals[i].el.classList.add('closing');
  const finish=()=>{while(modals.length>target)modals.pop().el.remove();};
  if(noHist){finish();if(cb)cb();return;}
  // myId identifies THIS request. pending/pendingSeq together track the one
  // request still awaiting its popstate: whichever of popstate or the 400ms
  // fallback timeout runs first "claims" it (by clearing pending) and the
  // other becomes a no-op. This stops the timeout from tearing down a NEW
  // modal that cb() opened after popstate already ran it (cb can call
  // openModal, which pushes its own history state before this request's
  // fallback timer fires) and stops a stale request's timeout acting after
  // a newer closeN call has already taken over `pending`.
  const myId=++pendingSeq;
  pending={id:myId,cb:cb||null};
  history.go(-n);
  setTimeout(()=>{
    if(!pending||pending.id!==myId)return;
    pending=null;
    if(modals.length>target)finish();
    if(cb)cb();
  },400);
}

window.addEventListener('popstate',e=>{
  const s=e.state||{route:{name:'home'},d:0};
  while(modals.length>(s.d||0))modals.pop().el.remove();
  if(s.route&&JSON.stringify(s.route)!==JSON.stringify(route)){route=s.route;render();window.scrollTo(0,0);}
  const p=pending;
  if(p){pending=null;if(p.cb)p.cb();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length)closeN(1);});

function confirmModal(o){
  const m=openModal({title:o.title,backdrop:true,
    body:`<p style="margin:0">${esc(o.msg)}</p>`,
    foot:`<button class="btn" type="button" data-x>Cancel</button><button class="btn ${o.danger===false?'pri':'dn'}" type="button" data-y>${esc(o.label||'Delete')}</button>`});
  $('[data-x]',m.el).onclick=()=>closeN(1);
  $('[data-y]',m.el).onclick=()=>o.onYes();
}

/* ===== screens ===== */

const backBtn=act=>`<button class="ib" data-act="${act}" aria-label="Back">${ic('back')}</button>`;
const warn=()=>Store.persistent?'':'<div class="warn">Browser storage isn\'t available here, so changes won\'t survive a refresh. Open the file in a normal browser tab or host it to keep your data.</div>';

function render(){

/* Home: a quick-action grid, two tiles per table (Add X / Edit X, X being the

    }).join('')+'</div>'
      +(viewCount?`<div class="qrow"><button class="btn" data-act="savedReports">${ic('bookmark',16)} Saved reports (${viewCount})</button></div>`:'')

/* The table list screen (what Home used to be): browse/open a table for its

/* A standalone search-and-pick modal, used by the home screen's "Edit X"
   tiles (there's no "current" record to jump to, so ask first). Reuses the
   same multi-field search as the link picker (linkSearchText) so e.g. typing
   a surname finds the right client. Picking a row opens it in recordModal,
   stacked on top like the reverse-link rows do. */
function pickRecordModal(tid){
  const t=Store.table(tid);
  if(!t)return;
  const label=singularize(t.name);
  openModal({
    title:'Edit '+label,
    body:`<div class="search">${ic('search',16)}<input id="pq" type="search" placeholder="Search ${esc(t.name.toLowerCase())}" autocomplete="off"></div><div class="meta" id="pMeta" style="padding-left:0"></div><div id="pList"></div>`,
    onMount(el){
      const q=$('#pq',el);
      function draw(){
        const query=q.value.trim().toLowerCase();
        let recs=Store.records(t.id);
        const total=recs.length;
        if(query)recs=recs.filter(r=>linkSearchText(t,r).includes(query));
        recs=sortRecs(recs,t.fields[0],'asc').slice(0,50);
        $('#pMeta',el).textContent=total?(query?`${recs.length} of ${total}`:`${total} record${total===1?'':'s'}`):'';
        const L=$('#pList',el);
        if(!total){L.className='';L.innerHTML=`<div class="empty"><h2>No records yet</h2><p>Add one from the home screen first.</p></div>`;return;}
        if(!recs.length){L.className='';L.innerHTML='<div class="empty">No matches.</div>';return;}
        L.className='list';
        // rowHtml() tags rows data-act="editRec", which the global click
        // delegate also matches (using route.tableId — wrong here, since
        // we're in a modal over the home screen, not a table screen). Swap
        // the attribute so only this modal's own listener acts on them.
        L.innerHTML=recs.map(r=>rowHtml(t,r)).join('').replaceAll('data-act="editRec"','data-act="pickRec"');
      }
      q.addEventListener('input',draw);
      $('#pList',el).addEventListener('click',e=>{
        const b=e.target.closest('[data-act=pickRec]');
        if(!b)return;
        e.stopPropagation();
        recordModal(t.id,b.dataset.id);
      });
      draw();
      if(window.matchMedia&&matchMedia('(pointer:fine)').matches)q.focus();
    }
  });
}

const TV={};
function tv(t){
  let v=TV[t.id];
  if(!v)v=TV[t.id]={q:'',sf:t.fields[0].id,dir:'asc'};
  if(!t.fields.some(f=>f.id===v.sf))v.sf=t.fields[0].id;
  return v;
}

function renderTable(app){
  const t=Store.table(route.tableId);
  if(!t){go({name:'home'},true);return;}
  const v=tv(t);
  document.title=t.name+' \u00b7 Base';
  app.innerHTML=hdr(esc(t.name),backBtn('home'),
    `<button class="ib" data-act="reports" aria-label="Reports">${ic('report')}</button><button class="ib" data-act="setup" aria-label="Table setup">${ic('sliders')}</button><button class="ib pri" data-act="addRec" aria-label="Add record">${ic('plus')}</button>`)
    +warn()
    +`<div class="tools"><div class="search">${ic('search',16)}<input id="q" type="search" placeholder="Search records" value="${esc(v.q)}" autocomplete="off"></div><div class="sortrow"><select id="sf" aria-label="Sort by">${t.fields.map(f=>`<option value="${f.id}" ${f.id===v.sf?'selected':''}>Sort: ${esc(f.name)}</option>`).join('')}</select><button class="btn" data-act="toggleDir" aria-label="Sort direction">${ic(v.dir==='asc'?'up':'down',16)}</button></div></div><div class="meta" id="recMeta"></div><div id="recList"></div>`;
  $('#q').addEventListener('input',e=>{v.q=e.target.value;renderList();});
  $('#sf').addEventListener('change',e=>{v.sf=e.target.value;renderList();});

}

function rowHtml(t,r){
  const f0=t.fields[0];
  const title=fmt(f0,r.v[f0.id])||'Untitled';
  const rest=t.fields.slice(1);
  const bf=rest.find(f=>f.type==='dropdown'&&!isEmpty(r.v[f.id]));
  const sub=rest.filter(f=>f.type!=='checkbox'&&!isEmpty(r.v[f.id])&&(!bf||f.id!==bf.id)).slice(0,3).map(f=>fmt(f,r.v[f.id])).join(' \u00b7 ');
  return `<button class="rec" data-act="editRec" data-id="${r.id}"><div class="m"><div class="t">${esc(title)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>${bf?`<span class="badge">${esc(r.v[bf.id])}</span>`:''}</button>`;
}

function renderList(){
  const t=Store.table(route.tableId);
  if(!t)return;
  const v=tv(t);
  let recs=Store.records(t.id);
  const total=recs.length;
  const q=v.q.trim().toLowerCase();
  if(q)recs=recs.filter(r=>recText(t,r).includes(q));
  recs=sortRecs(recs,t.fields.find(f=>f.id===v.sf),v.dir);
  $('#recMeta').textContent=total?(q?`${recs.length} of ${total} records`:`${total} record${total===1?'':'s'}`):'';
  const L=$('#recList');
  if(!total){
    L.className='';
    L.innerHTML=`<div class="empty"><h2>Add your first record</h2><p>Tap the plus button to start.</p><button class="btn pri" data-act="addRec">${ic('plus',16)} Add record</button></div>`;
    return;
  }
  if(!recs.length){L.className='';L.innerHTML='<div class="empty">No records match your search.</div>';return;}
  L.className='list';
  L.innerHTML=recs.map(r=>rowHtml(t,r)).join('');
}

/* ===== record modal ===== */
function recordModal(tid,rid){
  const t=Store.table(tid);
  const rec=rid?Store.records(tid).find(r=>r.id===rid):null;
  const v=rec?rec.v:{};
  const inputs=t.fields.map(f=>{
    const id='f_'+f.id,val=v[f.id];
    const lab=`<label for="${id}">${esc(f.name)}${f.required?' <span class="req">*</span>':''}</label>`;
    let inp;
    if(f.type==='checkbox')return `<div class="fld"><label class="chk"><input id="${id}" type="checkbox" ${val?'checked':''}> ${esc(f.name)}</label></div>`;
    if(f.type==='longtext')inp=`<textarea id="${id}" rows="3">${esc(isEmpty(val)?'':val)}</textarea>`;
    else if(f.type==='number')inp=`<input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(isEmpty(val)?'':val)}">`;
    else if(f.type==='date')inp=`<input id="${id}" type="date" value="${esc(isEmpty(val)?'':val)}">`;
    else if(f.type==='dropdown'){
      const opts=[...f.options];
      if(!isEmpty(val)&&!opts.includes(val))opts.push(val);
      inp=`<select id="${id}"><option value=""></option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }else if(f.type==='link'){
      const lt=Store.table(f.linkTable);
      const label=lt?linkLabel(f,val):'(table missing)';
      inp=`<div class="linkpick" data-fid="${f.id}"><input id="${id}" type="text" autocomplete="off" placeholder="${lt?'Search '+esc(lt.name):''}" value="${esc(isEmpty(val)?'':label)}" data-val="${esc(isEmpty(val)?'':val)}" ${lt?'':'disabled'}><div class="lpmenu" hidden></div></div>`;
    }else if(f.type==='lookup'){
      const viaField=t.fields.find(x=>x.id===f.via);
      const srcTable=viaField?Store.table(viaField.linkTable):null;
      const srcField=srcTable?srcTable.fields.find(x=>x.id===f.srcField):null;
      const display=val&&!isEmpty(val.value)?(val.label!==undefined?val.label:String(val.value)):'';
      return `<div class="fld"><label>${esc(f.name)}</label><input type="text" value="${esc(display)}" disabled data-lookup="${f.id}"><p class="hint" style="margin-top:4px">${srcField?'Pulled from '+esc(srcTable.name)+' → '+esc(srcField.name):'Source field missing'}</p></div>`;
    }else inp=`<input id="${id}" type="text" value="${esc(isEmpty(val)?'':val)}" autocomplete="off">`;
    return `<div class="fld">${lab}${inp}<div class="err" data-e="${f.id}"></div></div>`;
  }).join('');
  const revLinks=rec?reverseLinks(tid,rec.id):[];
  const revHtml=revLinks.length?`<div class="revlinks">${revLinks.map(rl=>`<div class="revgroup"><div class="lab">${esc(rl.table.name)} (${rl.recs.length})</div>${rl.recs.map(rr=>{
    const f0=rl.table.fields[0];
    const title=fmt(f0,rr.v[f0.id])||'Untitled';
    return `<button type="button" class="rec revrow" data-revtable="${rl.table.id}" data-revrec="${rr.id}"><div class="m"><div class="t">${esc(title)}</div></div>${ic('chev',16)}</button>`;
  }).join('')}</div>`).join('')}</div>`:'';
  openModal({
    title:rec?'Edit record':'Add record',
    body:`<form id="rf" novalidate>${inputs}<div class="err" id="rerr"></div></form>${revHtml}`,
    foot:`${rec?`<button class="btn dn" type="button" data-del>${ic('trash',16)} Delete</button>`:''}<span class="sp"></span><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="submit" form="rf">Save</button>`,
    onMount(el){
      // Opens the linked record ON TOP of this one (stacked, like any nested
      // modal) rather than closing this one first — closing first would pop
      // this modal's history entry and then push a new one for the linked
      // record, discarding that entry, so hardware back would skip past this
      // record straight to the table underneath instead of returning here.
      $$('.revrow',el).forEach(b=>b.onclick=()=>{
        const rtid=b.dataset.revtable,rrid=b.dataset.revrec;
        recordModal(rtid,rrid);
      });
      if(window.matchMedia&&matchMedia('(pointer:fine)').matches&&!rec){const first=$('input,select,textarea',el);if(first&&first.type!=='checkbox')first.focus();}
      $('[data-cancel]',el).onclick=()=>closeN(1);
      const del=$('[data-del]',el);
      if(del)del.onclick=()=>{
        const f0=t.fields[0];
        const nm=fmt(f0,rec.v[f0.id])||'this record';
        confirmModal({title:'Delete record',msg:`Delete \u201c${nm}\u201d? This can't be undone.`,onYes:()=>{
          Store.deleteRecord(tid,rid);closeN(2);render();toast('Deleted');
        }});
      };
      // Lookup fields snapshot from their governing link field. lookupVals holds
      // the live computed {value,label} per lookup field id, recalculated whenever
      // the link field it depends on changes (see setupLinkPicker's onChange).
      const lookupVals={};
      t.fields.filter(f=>f.type==='lookup').forEach(f=>{
        const viaField=t.fields.find(x=>x.id===f.via);
        const initLinkVal=viaField?v[viaField.id]:undefined;
        lookupVals[f.id]=rec?(v[f.id]||null):computeLookup(f,initLinkVal,t);
      });
      function refreshLookupsFor(linkFieldId,newLinkVal){
        t.fields.filter(f=>f.type==='lookup'&&f.via===linkFieldId).forEach(f=>{
          lookupVals[f.id]=computeLookup(f,newLinkVal,t);
          const dispInp=$(`[data-lookup="${f.id}"]`,el);
          if(dispInp)dispInp.value=lookupVals[f.id]?(lookupVals[f.id].label!==undefined?lookupVals[f.id].label:String(lookupVals[f.id].value)):'';
        });
      }
      $$('.linkpick',el).forEach(wrap=>setupLinkPicker(wrap,t.fields.find(f=>f.id===wrap.dataset.fid),refreshLookupsFor));
      $('#rf',el).addEventListener('submit',e=>{
        e.preventDefault();
        $$('.err',el).forEach(x=>x.textContent='');
        const nv={};let ok=true,any=false;
        t.fields.forEach(f=>{
          if(f.type==='lookup'){
            nv[f.id]=lookupVals[f.id]||null;
            if(nv[f.id]&&!isEmpty(nv[f.id].value))any=true;
            return;
          }
          const inp=$('#f_'+f.id,el);
          let val;
          if(f.type==='checkbox'){val=inp.checked;if(val)any=true;}
          else if(f.type==='link'){
            val=inp.dataset.val||'';
            if(inp.value.trim()==='')val='';
            if(!isEmpty(val))any=true;
            if(f.required&&isEmpty(val)){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Required';}
          }else{
            if(f.type==='number')val=inp.value===''?'':Number(inp.value);
            else val=inp.value.trim();
            if(!isEmpty(val))any=true;
            if(f.required&&isEmpty(val)){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Required';}
          }
          nv[f.id]=val;
        });
        if(ok&&!any){ok=false;$('#rerr',el).textContent='Enter at least one value.';}
        if(!ok)return;
        const now=new Date().toISOString();
        const r=rec?Object.assign({},rec,{v:nv,updated:now}):{id:uid(),v:nv,created:now,updated:now};
        Store.saveRecord(tid,r);
        closeN(1);render();toast(rec?'Saved':'Record added');
      });
    }
  });
}

/* Wires a link field's text input to a filtered dropdown of the target table's
   records. Selecting an option sets data-val (the record id) on the input;
   editing the text without picking a new option clears data-val on blur.
   Search matches against every field on the linked table (linkSearchText),
   not just the title field, so e.g. a surname matches even when the record
   is titled by first name. onChange(fieldId, newLinkedRecordId) fires after
   a selection or a clear, so dependent Lookup fields can refresh. */
function setupLinkPicker(wrap,f,onChange){
  const lt=Store.table(f.linkTable);
  if(!lt)return;
  const inp=$('input',wrap),menu=$('.lpmenu',wrap);
  const opts=()=>Store.records(lt.id).map(r=>({id:r.id,label:fmt(lt.fields[0],r.v[lt.fields[0].id])||'Untitled',search:linkSearchText(lt,r)})).sort((a,b)=>a.label.localeCompare(b.label,'en-GB',{sensitivity:'base'}));
  function draw(){
    const q=inp.value.trim().toLowerCase();
    const list=opts().filter(o=>!q||o.search.includes(q)).slice(0,50);
    menu.innerHTML=list.length?list.map(o=>`<button type="button" class="lpopt" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join(''):`<div class="lpempty">No matches</div>`;
    menu.hidden=false;
  }
  inp.addEventListener('focus',draw);
  inp.addEventListener('input',()=>{
    if(inp.dataset.val){inp.dataset.val='';if(onChange)onChange(f.id,'');}
    draw();
  });
  menu.addEventListener('mousedown',e=>{
    const b=e.target.closest('.lpopt');if(!b)return;
    e.preventDefault();
    inp.value=b.textContent;inp.dataset.val=b.dataset.id;
    menu.hidden=true;
    if(onChange)onChange(f.id,b.dataset.id);
  });
  inp.addEventListener('blur',()=>{
    setTimeout(()=>{
      menu.hidden=true;
      if(!inp.dataset.val)inp.value='';
    },150);
  });
}

/* ===== table setup modal ===== */
function tableModal(tid){
  const orig=tid?Store.table(tid):null;
  const hasRecs=!!tid&&Store.records(tid).length>0;
  const draft=orig
    ?{name:orig.name,fields:orig.fields.map(f=>({id:f.id,name:f.name,type:f.type,required:!!f.required,options:[...(f.options||[])],linkTable:f.linkTable||'',via:f.via||'',srcField:f.srcField||'',isNew:false}))}
    :{name:'',fields:[{id:uid(),name:'Name',type:'text',required:true,options:[],linkTable:'',via:'',srcField:'',isNew:true}]};
  const otherTables=Store.tables().filter(x=>x.id!==tid);
  openModal({
    title:orig?'Table setup':'New table',
    body:`<div class="fld"><label for="tn">Table name</label><input id="tn" type="text" value="${esc(draft.name)}" placeholder="Clients" autocomplete="off"></div><div class="lab">Fields</div><div id="fl"></div><button class="btn" id="af" type="button">${ic('plus',16)} Add field</button><div class="err" id="terr"></div>${hasRecs?'<p class="hint">Field types can\'t be changed once a table has records. Removing a field deletes its data.</p>':''}`,
    foot:`${orig?`<button class="btn dn" type="button" data-deltable>${ic('trash',16)} Delete table</button>`:''}<span class="sp"></span><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="button" data-save>Save</button>`,
    onMount(el){
      const fl=$('#fl',el);
      function renderFields(){
        const last=draft.fields.length-1;
        const linkFields=draft.fields.filter(x=>x.type==='link'&&x.linkTable);
        fl.innerHTML=draft.fields.map((f,i)=>{
          const locked=!f.isNew&&hasRecs;
          const typeOpts=Object.keys(TYPES).filter(k=>(k!=='link'||otherTables.length)&&(k!=='lookup'||linkFields.length));
          let lookupUi='';
          if(f.type==='lookup'){
            const viaField=linkFields.find(x=>x.id===f.via)||linkFields[0];
            if(viaField&&!f.via)f.via=viaField.id;
            const srcTable=viaField?Store.table(viaField.linkTable):null;
            const srcOpts=srcTable?lookupSourceFields(srcTable):[];
            lookupUi=`<div class="fr2"><select class="flvia" ${locked?'disabled':''}>${linkFields.map(x=>`<option value="${x.id}" ${x.id===f.via?'selected':''}>via ${esc(x.name)}</option>`).join('')}</select><select class="flsrc" ${locked?'disabled':''}><option value="">Choose a field…</option>${srcOpts.map(x=>`<option value="${x.id}" ${x.id===f.srcField?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
          }
          return `<div class="frow" data-i="${i}"><div class="fr1"><input class="fn" value="${esc(f.name)}" placeholder="Field name" autocomplete="off"><button class="ib" type="button" data-mv="-1" aria-label="Move up" ${i===0?'disabled':''}>${ic('up',16)}</button><button class="ib" type="button" data-mv="1" aria-label="Move down" ${i===last?'disabled':''}>${ic('down',16)}</button><button class="ib" type="button" data-rm aria-label="Remove field">${ic('trash',16)}</button></div><div class="fr2"><select class="ft" ${locked?'disabled':''}>${typeOpts.map(k=>`<option value="${k}" ${k===f.type?'selected':''}>${TYPES[k]}</option>`).join('')}</select>${(f.type!=='checkbox'&&f.type!=='lookup')?`<label class="chk"><input type="checkbox" class="fq" ${f.required?'checked':''}> Required</label>`:''}</div>${f.type==='dropdown'?`<textarea class="fo" rows="2" placeholder="Options, one per line">${esc(f.options.join('\n'))}</textarea>`:''}${f.type==='link'?`<select class="flt2" ${locked?'disabled':''}><option value="">Choose a table…</option>${otherTables.map(x=>`<option value="${x.id}" ${x.id===f.linkTable?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}${lookupUi}</div>`;
        }).join('');
      }
      function sync(){
        draft.name=$('#tn',el).value;
        $$('.frow',el).forEach(row=>{
          const f=draft.fields[+row.dataset.i];
          f.name=$('.fn',row).value;
          const q=$('.fq',row);f.required=q?q.checked:false;
          const o=$('.fo',row);if(o)f.options=o.value.split('\n').map(s=>s.trim()).filter(Boolean);
          const lk=$('.flt2',row);if(lk)f.linkTable=lk.value;
          const via=$('.flvia',row);if(via)f.via=via.value;
          const src=$('.flsrc',row);if(src)f.srcField=src.value;
          const ty=$('.ft',row);if(ty&&!ty.disabled)f.type=ty.value;
        });
      }
      renderFields();
      fl.addEventListener('click',e=>{
        const mv=e.target.closest('[data-mv]');
        const rm=e.target.closest('[data-rm]');
        if(mv){
          sync();
          const i=+mv.closest('.frow').dataset.i,j=i+ +mv.dataset.mv;
          if(j<0||j>=draft.fields.length)return;
          const tmp=draft.fields[i];draft.fields[i]=draft.fields[j];draft.fields[j]=tmp;
          renderFields();
        }else if(rm){
          sync();
          if(draft.fields.length===1){toast('A table needs at least one field');return;}
          draft.fields.splice(+rm.closest('.frow').dataset.i,1);
          renderFields();
        }
      });
      fl.addEventListener('change',e=>{
        if(e.target.matches('.ft,.flt2,.flvia')){
          if(e.target.classList.contains('flvia')){
            sync();
            const row=e.target.closest('.frow');
            draft.fields[+row.dataset.i].srcField='';
          }else sync();
          renderFields();
        }
      });
      $('#af',el).onclick=()=>{
        sync();
        draft.fields.push({id:uid(),name:'',type:'text',required:false,options:[],linkTable:'',via:'',srcField:'',isNew:true});
        renderFields();
        const ins=$$('.fn',el);ins[ins.length-1].focus();
      };
      $('[data-cancel]',el).onclick=()=>closeN(1);
      const dt=$('[data-deltable]',el);
      if(dt)dt.onclick=()=>{
        const n=Store.records(tid).length;
        confirmModal({title:'Delete table',msg:`Delete \u201c${orig.name}\u201d and its ${n} record${n===1?'':'s'}? This can't be undone.`,onYes:()=>{
          Store.deleteTable(tid);delete TV[tid];delete REP[tid];
          closeN(modals.length,()=>{go({name:'home'});toast('Table deleted');});
        }});
      };
      $('[data-save]',el).onclick=()=>{
        sync();
        const err=$('#terr',el);err.textContent='';
        const name=draft.name.trim();
        if(!name){err.textContent='Enter a table name.';return;}
        const names=draft.fields.map(f=>f.name.trim().toLowerCase());
        if(names.some(n=>!n)){err.textContent='Every field needs a name.';return;}
        if(new Set(names).size!==names.length){err.textContent='Field names must be different.';return;}
        if(draft.fields.some(f=>f.type==='dropdown'&&!f.options.length)){err.textContent='Add at least one option to each dropdown.';return;}
        if(draft.fields.some(f=>f.type==='link'&&!f.linkTable)){err.textContent='Choose a table for each link field.';return;}
        if(draft.fields.some(f=>f.type==='lookup'&&(!f.via||!f.srcField))){err.textContent='Choose a link and a field to pull in for each lookup field.';return;}
        const removed=orig?orig.fields.filter(f=>!draft.fields.some(d=>d.id===f.id)):[];
        const loss=removed.length&&Store.records(tid).some(r=>removed.some(f=>!isEmpty(r.v[f.id])));
        const apply=()=>{
          const t={id:orig?orig.id:uid(),name:name,created:orig?orig.created:new Date().toISOString(),
            fields:draft.fields.map(f=>({id:f.id,name:f.name.trim(),type:f.type,required:(f.type==='checkbox'||f.type==='lookup')?false:f.required,options:f.type==='dropdown'?f.options:[],linkTable:f.type==='link'?f.linkTable:'',via:f.type==='lookup'?f.via:'',srcField:f.type==='lookup'?f.srcField:''}))};
          Store.saveTable(t);
          if(orig&&removed.length){
            Store.records(tid).forEach(r=>removed.forEach(f=>delete r.v[f.id]));
            Store.commit();
          }
          closeN(modals.length,()=>{
            if(!orig)go({name:'table',tableId:t.id});
            else{render();toast('Saved');}
          });
        };
        if(loss)confirmModal({title:'Remove fields',msg:`Removing ${removed.map(f=>'\u201c'+f.name+'\u201d').join(', ')} deletes its data from existing records.`,label:'Remove',onYes:apply});
        else apply();
      };
    }
  });
}

$('#impf').addEventListener('change',e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o;
    try{o=JSON.parse(rd.result);}catch(x){o=null;}
    if(!o||!Array.isArray(o.tables)||!o.tables.every(t=>t&&t.id&&t.name&&Array.isArray(t.fields))){toast('That file isn\'t a valid backup');return;}
    confirmModal({title:'Import backup',msg:`Replace everything here with this backup (${o.tables.length} table${o.tables.length===1?'':'s'})?`,label:'Replace',danger:false,onYes:()=>{
      Store.importAll(o);Object.keys(TV).forEach(k=>delete TV[k]);Object.keys(REP).forEach(k=>delete REP[k]);
      closeN(modals.length,()=>{go({name:'home'},true);toast('Backup imported');});
    }});
  };
  rd.readAsText(file);
});

/* ===== reports ===== */
const REP={};
function rs(t){
  let s=REP[t.id];
  if(!s)s=REP[t.id]={viewId:'',fields:t.fields.map(f=>f.id),filters:[],sf:'',dir:'asc'};
  s.fields=s.fields.filter(id=>t.fields.some(f=>f.id===id));
  if(!s.fields.length)s.fields=t.fields.map(f=>f.id);
  s.filters=s.filters.filter(x=>t.fields.some(f=>f.id===x.fid));
  s.filters.forEach(x=>{const f=t.fields.find(y=>y.id===x.fid);if(!OPS[f.type].some(o=>o[0]===x.op)){x.op=OPS[f.type][0][0];x.value='';}});
  if(s.sf&&!t.fields.some(f=>f.id===s.sf))s.sf='';
  if(s.viewId&&!Store.views(t.id).some(v=>v.id===s.viewId))s.viewId='';
  return s;
}

function runReport(t,s){
  const recs=Store.records(t.id).filter(r=>s.filters.every(fl=>match(r,t.fields.find(f=>f.id===fl.fid),fl)));
  const sorted=sortRecs(recs,t.fields.find(f=>f.id===s.sf),s.dir);
  return {recs:sorted,cols:t.fields.filter(f=>s.fields.includes(f.id))};
}

function fltRow(t,fl,i){
  const f=t.fields.find(x=>x.id===fl.fid);
  let val='';
  if(!noVal(fl.op)){
    if(f.type==='dropdown')val=`<select class="fv"><option value=""></option>${f.options.map(o=>`<option ${o===fl.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='link'){
      const lt=Store.table(f.linkTable);
      const opts=lt?Store.records(lt.id).map(r=>({id:r.id,label:fmt(lt.fields[0],r.v[lt.fields[0].id])||'Untitled'})).sort((a,b)=>a.label.localeCompare(b.label,'en-GB',{sensitivity:'base'})):[];
      val=`<select class="fv"><option value=""></option>${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===fl.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    else val=`<input class="fv" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" ${f.type==='number'?'step="any"':''} value="${esc(fl.value)}" placeholder="Value" autocomplete="off">`;
  }
  return `<div class="flt" data-i="${i}"><select class="ff" aria-label="Field">${t.fields.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select class="fop" aria-label="Condition">${OPS[f.type].map(o=>`<option value="${o[0]}" ${o[0]===fl.op?'selected':''}>${o[1]}</option>`).join('')}</select><button class="ib" type="button" data-rmf aria-label="Remove filter">${ic('x',16)}</button>${val?`<div class="fvw">${val}</div>`:''}</div>`;
}

function updatePreview(t,s){
  const r=runReport(t,s);
  const total=Store.records(t.id).length;
  $('#repMeta').textContent=`${r.recs.length} of ${total} records`+(r.recs.length>100?' \u00b7 showing first 100, downloads include all':'');
  $('#repPrev').innerHTML=r.recs.length
    ?`<table class="rt"><thead><tr>${r.cols.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${r.recs.slice(0,100).map(rec=>`<tr>${r.cols.map(f=>`<td class="${f.type==='number'?'num':''}">${esc(fmt(f,rec.v[f.id]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    :'<div class="empty" style="padding:24px">No records match.</div>';
}

function renderReports(app){
  const t=Store.table(route.tableId);
  if(!t){go({name:'home'},true);return;}
  const s=rs(t);
  const views=Store.views(t.id);
  document.title='Reports \u00b7 '+t.name;
  app.innerHTML=hdr('Reports: '+esc(t.name),backBtn('backTable'))
    +`<div class="card"><h3>View</h3><select id="rv" aria-label="Saved view"><option value="">New view</option>${views.map(v=>`<option value="${v.id}" ${v.id===s.viewId?'selected':''}>${esc(v.name)}</option>`).join('')}</select><div class="rowbtns"><button class="btn" type="button" id="svv">Save view</button>${s.viewId?'<button class="btn dn" type="button" id="dvv">Delete view</button>':''}</div></div>`
    +`<div class="card"><h3>Fields to include</h3><div class="chips">${t.fields.map(f=>`<button class="chip ${s.fields.includes(f.id)?'on':''}" type="button" data-f="${f.id}">${esc(f.name)}</button>`).join('')}</div></div>`
    +`<div class="card"><h3>Filters</h3><div id="flts"></div><button class="btn" type="button" id="af2">${ic('plus',16)} Add filter</button></div>`
    +`<div class="card"><h3>Sort</h3><div class="sortrow"><select id="rsf" aria-label="Sort by"><option value="">Original order</option>${t.fields.map(f=>`<option value="${f.id}" ${f.id===s.sf?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class="btn" type="button" id="rdir" aria-label="Sort direction">${ic(s.dir==='asc'?'up':'down',16)}</button></div></div>`
    +`<div class="meta" id="repMeta"></div><div class="tblwrap" id="repPrev"></div><div class="actions"><button class="btn" type="button" id="rcsv">${ic('download',16)} CSV</button><button class="btn pri" type="button" id="rprint">${ic('print',16)} Print / PDF</button></div>`;

  const drawFilters=()=>{$('#flts').innerHTML=s.filters.map((fl,i)=>fltRow(t,fl,i)).join('');updatePreview(t,s);};
  drawFilters();

  $('#rv').onchange=e=>{
    const id=e.target.value;
    if(!id){s.viewId='';s.fields=t.fields.map(f=>f.id);s.filters=[];s.sf='';s.dir='asc';}
    else{
      const v=views.find(x=>x.id===id);
      s.viewId=v.id;s.fields=[...v.fields];s.filters=v.filters.map(x=>Object.assign({},x));s.sf=v.sf||'';s.dir=v.dir||'asc';
    }
    renderReports($('#app'));
  };
  $$('.chip',app).forEach(b=>b.onclick=()=>{
    const id=b.dataset.f,i=s.fields.indexOf(id);
    if(i>=0){if(s.fields.length===1){toast('Keep at least one field');return;}s.fields.splice(i,1);}
    else s.fields.push(id);
    renderReports($('#app'));
  });
  $('#af2').onclick=()=>{
    const f=t.fields[0];
    s.filters.push({fid:f.id,op:OPS[f.type][0][0],value:''});
    drawFilters();
  };
  const fe=$('#flts');
  fe.addEventListener('change',e=>{
    const row=e.target.closest('.flt');if(!row)return;
    const fl=s.filters[+row.dataset.i];
    if(e.target.classList.contains('ff')){
      fl.fid=e.target.value;
      const f=t.fields.find(x=>x.id===fl.fid);
      fl.op=OPS[f.type][0][0];fl.value='';
      drawFilters();
    }else if(e.target.classList.contains('fop')){
      fl.op=e.target.value;
      if(noVal(fl.op))fl.value='';
      drawFilters();
    }else if(e.target.classList.contains('fv')){
      fl.value=e.target.value;updatePreview(t,s);
    }
  });
  fe.addEventListener('input',e=>{
    if(!e.target.classList.contains('fv'))return;
    const row=e.target.closest('.flt');
    s.filters[+row.dataset.i].value=e.target.value;
    updatePreview(t,s);
  });
  fe.addEventListener('click',e=>{
    const b=e.target.closest('[data-rmf]');if(!b)return;
    s.filters.splice(+b.closest('.flt').dataset.i,1);
    drawFilters();
  });
  $('#rsf').onchange=e=>{s.sf=e.target.value;updatePreview(t,s);};
  $('#rdir').onclick=()=>{s.dir=s.dir==='asc'?'desc':'asc';renderReports($('#app'));};
  $('#svv').onclick=()=>viewModal(t,s);
  const dv=$('#dvv');
  if(dv)dv.onclick=()=>{
    const cur=views.find(v=>v.id===s.viewId);
    confirmModal({title:'Delete view',msg:`Delete the view \u201c${cur.name}\u201d?`,onYes:()=>{
      Store.deleteView(t.id,s.viewId);s.viewId='';closeN(1);renderReports($('#app'));toast('View deleted');
    }});
  };
  $('#rcsv').onclick=()=>exportCsv(t,s);
  $('#rprint').onclick=()=>printReport(t,s);
}

/* Home screen's "Saved reports" quick-access: lists every saved view across
   every table, grouped by table. Picking one loads that view's fields/
   filters/sort into the report state (rs()) and jumps straight to the
   Reports screen for its table, already showing that saved report. */
function savedReportsModal(){
  const ts=Store.tables();
  const groups=ts.map(t=>({t,views:Store.views(t.id)})).filter(g=>g.views.length);
  openModal({
    title:'Saved reports',
    body:groups.length
      ?groups.map(g=>`<div class="viewgroup"><h4>${esc(g.t.name)}</h4>${g.views.map(v=>`<button class="viewrow" data-act="openView" data-tid="${g.t.id}" data-vid="${v.id}"><span class="vic">${ic('report',16)}</span><span class="m"><span class="t">${esc(v.name)}</span><span class="s">${v.fields.length} field${v.fields.length===1?'':'s'}${v.filters&&v.filters.length?' · '+v.filters.length+' filter'+(v.filters.length===1?'':'s'):''}</span></span>${ic('chev',16)}</button>`).join('')}</div>`).join('')
      :`<div class="empty"><h2>No saved reports yet</h2><p>Open a table's Reports screen, set up your fields and filters, then save it as a view.</p></div>`,
    onMount(el){
      $$('[data-act=openView]',el).forEach(b=>b.onclick=()=>{
        const tid=b.dataset.tid,vid=b.dataset.vid;
        const t=Store.table(tid);
        if(!t)return;
        const v=Store.views(tid).find(x=>x.id===vid);
        if(!v)return;
        const s=rs(t);
        s.viewId=v.id;s.fields=[...v.fields];s.filters=v.filters.map(x=>Object.assign({},x));s.sf=v.sf||'';s.dir=v.dir||'asc';
        closeN(1,()=>go({name:'reports',tableId:tid}));
      });
    }
  });
}

function viewModal(t,s){
  const cur=s.viewId?Store.views(t.id).find(v=>v.id===s.viewId):null;
  openModal({title:'Save view',
    body:`<div class="fld"><label for="vn">View name</label><input id="vn" type="text" value="${esc(cur?cur.name:'')}" placeholder="Active clients" autocomplete="off"><div class="err" id="verr"></div></div>`,
    foot:`<button class="btn" type="button" data-cancel>Cancel</button>${cur?'<button class="btn" type="button" data-new>Save as new</button>':''}<button class="btn pri" type="button" data-save>Save</button>`,
    onMount(el){
      const save=asNew=>{
        const name=$('#vn',el).value.trim();
        if(!name){$('#verr',el).textContent='Enter a name.';return;}
        const cfg={fields:[...s.fields],filters:s.filters.map(x=>Object.assign({},x)),sf:s.sf,dir:s.dir};
        const v=(cur&&!asNew)?Object.assign({},cur,cfg,{name:name}):Object.assign({id:uid(),name:name},cfg);
        Store.saveView(t.id,v);s.viewId=v.id;
        closeN(1);renderReports($('#app'));toast('View saved');
      };
      $('[data-cancel]',el).onclick=()=>closeN(1);
      $('[data-save]',el).onclick=()=>save(false);
      const nw=$('[data-new]',el);if(nw)nw.onclick=()=>save(true);
      $('#vn',el).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save(false);}});
    }
  });
}

function csvCell(x){x=String(isEmpty(x)?'':x);return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
function viewName(t,s){const v=s.viewId?Store.views(t.id).find(x=>x.id===s.viewId):null;return v?v.name:'';}

function exportCsv(t,s){
  const r=runReport(t,s);
  const rows=[r.cols.map(f=>f.name)].concat(r.recs.map(rec=>r.cols.map(f=>fmt(f,rec.v[f.id],true))));
  dl(`${slug(t.name)}-${slug(viewName(t,s)||'report')}-${today()}.csv`,'\uFEFF'+rows.map(x=>x.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  toast('CSV downloaded');
}

function printReport(t,s){
  const r=runReport(t,s);
  const vn=viewName(t,s);
  const d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  $('#printArea').innerHTML=`<h1>${esc(t.name)}${vn?' \u2013 '+esc(vn):''}</h1><p>${r.recs.length} record${r.recs.length===1?'':'s'} \u00b7 Generated ${d}</p><table><thead><tr>${r.cols.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${r.recs.map(rec=>`<tr>${r.cols.map(f=>`<td style="${f.type==='number'?'text-align:right':''}">${esc(fmt(f,rec.v[f.id]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  window.print();
}

/* ===== page-level actions ===== */
const ACT={
  home:()=>go({name:'home'}),
  tables:()=>go({name:'tables'}),
  openTable:el=>go({name:'table',tableId:el.dataset.id}),
  newTable:()=>tableModal(null),
  dataMenu:()=>dataModal(),
  sample:()=>loadSample(),
  addRec:()=>recordModal(route.tableId,null),
  editRec:el=>recordModal(route.tableId,el.dataset.id),
  qadd:el=>recordModal(el.dataset.id,null),
  qedit:el=>pickRecordModal(el.dataset.id),
  savedReports:()=>savedReportsModal(),
  setup:()=>tableModal(route.tableId),
  reports:()=>go({name:'reports',tableId:route.tableId}),
  backTable:()=>go({name:'table',tableId:route.tableId}),
  toggleDir:()=>{const t=Store.table(route.tableId);const v=tv(t);v.dir=v.dir==='asc'?'desc':'asc';renderTable($('#app'));}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.closest('.overlay'))return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el);
});

/* ===== start ===== */
Store.init();
try{history.replaceState({route:route,d:0},'');}catch(e){}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>

<!--
  HOW THIS PAGE WORKS
  --------------------
  This page has no page list to maintain. On load it asks the GitHub API
  for the contents of the repo it's currently being served from, and
  turns every .html file (and every subfolder) it finds into a tile.
  Add a new page, refresh, and a new tile appears -- nothing here needs
  to change.

  Because you're on a custom domain (palabraword.uk), this page can't
  work out your GitHub username from the address the way it could on a
  plain yourname.github.io site. Set it once below and every repo using
  this template will work the same way:

    <meta name="github-user" content="rwapps1">

  It works out which repo it's in from the URL path automatically, so
  you only need the username, not the repo name. If you ever need to
  point a page at a repo that doesn't match its own URL, you can still
  use <meta name="github-repo" content="owner/repo"> instead, which
  takes priority over both of the above.

  Copy this file into any repo as-is -- update the title below to that
  repo's name, and it'll pick up that repo's own files automatically.
-->
<meta name="github-user" content="">
<meta name="github-repo" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600&display=swap">
<style>
  :root {
    --bg: #F7F7FB;
    --card: #FFFFFF;
    --ink: #1E1B2E;
    --mist: #8D8B9B;
    --border: #ECEBF3;
    --coral: #FF5A5F;  --coral-soft: #FFEEEE;
    --teal:  #17C3A2;  --teal-soft:  #E4FBF6;
    --amber: #FFB238;  --amber-soft: #FFF6E6;
    --purple:#8C6FF7;  --purple-soft:#F1ECFF;
    --pink:  #FF6FA5;  --pink-soft:  #FFEEF5;
    --blue:  #3E8EFF;  --blue-soft:  #E8F1FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 48px 20px 60px;
  }
  header {
    max-width: 960px;
    margin: 0 auto 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    margin: 0;
  }
  .badge {
    background: var(--purple-soft);
    color: var(--purple);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    padding: 5px 14px;
    border-radius: 999px;
  }
  .synced {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--mist);
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); display: inline-block; }

  main { max-width: 960px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }

  .tile {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 20px 24px;
    text-align: left;
    text-decoration: none;
    color: var(--ink);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    opacity: 0.35;
  }
  .tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(30,27,46,0.08); }
  .tile:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  .icon-badge {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: var(--glow-soft);
    color: var(--glow);
    position: relative; z-index: 1;
  }
  .icon-badge svg { width: 22px; height: 22px; }

  .eyebrow {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--glow);
    position: relative; z-index: 1;
  }
  .tile-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 1.15rem;
    margin: 0;
    position: relative; z-index: 1;
  }
  .tile-sub {
    font-size: 0.82rem;
    color: var(--mist);
    font-weight: 500;
    margin: 0;
    position: relative; z-index: 1;
  }

  .status {
    max-width: 960px;
    margin: 10px auto 0;
    color: var(--mist);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .status.error { color: #B0453F; }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Menu</h1>
  <span class="badge">TOOLS</span>
  <span class="synced" id="synced" hidden><span class="dot"></span><span id="synced-text"></span></span>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="status" id="status">Loading&hellip;</p>
</main>

<script>
(function () {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const synced = document.getElementById('synced');
  const syncedText = document.getElementById('synced-text');

  const ICONS = [
    { keys: ['people','team','staff','adviser','advisor','client','member','hr','user','users'], label: 'Team', color: 'pink',
      svg: '<path d="M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm6-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3 0-6 1.5-6 4v2h9v-2c0-1.1.4-2.1 1.1-2.9C12.1 13.4 10.5 13 9 13z"/>' },
    { keys: ['excel','spreadsheet','report','chart','data','analytics','dashboard','stats','submission'], label: 'Data', color: 'blue',
      svg: '<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>' },
    { keys: ['resume','cv','doc','document','paper','pdf'], label: 'Docs', color: 'coral',
      svg: '<rect x="4" y="3" width="14" height="18" rx="2"/><path d="M8 8h6M8 12h6M8 16h4"/>' },
    { keys: ['contact','mail','email'], label: 'Contact', color: 'blue',
      svg: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 6 10-6"/>' },
    { keys: ['about','info','profile','bio'], label: 'Info', color: 'teal',
      svg: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>' },
    { keys: ['project','portfolio','work','case'], label: 'Project', color: 'blue',
      svg: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
    { keys: ['game','games','play','arcade'], label: 'Game', color: 'teal',
      svg: '<rect x="2" y="7" width="20" height="10" rx="5"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.5" r="1" fill="currentColor" stroke="none"/>' },
    { keys: ['map','travel','trip','location','places','run','parkrun'], label: 'Results', color: 'teal',
      svg: '<path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>' },
    { keys: ['code','dev','api','script'], label: 'Code', color: 'purple',
      svg: '<path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/>' },
    { keys: ['calendar','schedule','event','plan'], label: 'Event', color: 'pink',
      svg: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>' },
    { keys: ['shop','store','shopping','cart'], label: 'Shop', color: 'amber',
      svg: '<circle cx="9" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="21" r="1" fill="currentColor" stroke="none"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L23 6H6"/>' },
    { keys: ['book','library','read','story','stories'], label: 'Reading', color: 'teal',
      svg: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
    { keys: ['recipe','food','cook','kitchen','menu'], label: 'Recipe', color: 'coral',
      svg: '<path d="M18 2v8a2 2 0 0 1-2 2h0M16 2v20M8 2v6a2 2 0 0 0 2 2 2 2 0 0 0 2-2V2M10 10v12"/>' },
    { keys: ['photo','gallery','image','picture','pictures','pics'], label: 'Photos', color: 'coral',
      svg: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4 4-3-3-6 6"/>' },
    { keys: ['video','movie','film','clip'], label: 'Video', color: 'coral',
      svg: '<rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/>' },
    { keys: ['music','audio','song','sound','podcast'], label: 'Music', color: 'teal',
      svg: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>' },
    { keys: ['blog','post','article','journal','diary','writing'], label: 'Blog', color: 'amber',
      svg: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>' },
    { keys: ['spanish','quiz','lang','learn'], label: 'Learning', color: 'purple',
      svg: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>' },
    { keys: ['tool','utility','settings','config','admin','setup'], label: 'Utility', color: 'amber',
      svg: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9L6.7 20.3a2.1 2.1 0 0 1-3-3L10.6 10.5a6 6 0 0 1 7.9-7.9z"/>' }
  ];
  const FOLDER_ICON = { label: 'Folder', color: 'purple',
    svg: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' };
  const DEFAULT_ICON = { label: 'Page', color: 'blue',
    svg: '<rect x="4" y="3" width="14" height="18" rx="2"/><path d="M8 8h6M8 12h6M8 16h4"/>' };

  const FALLBACK_COLORS = ['blue', 'coral', 'teal', 'purple', 'pink', 'amber'];
  function hashColor(name) {
    let sum = 0;
    for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
    return FALLBACK_COLORS[sum % FALLBACK_COLORS.length];
  }

  function pickIcon(name, isDir) {
    const lower = name.toLowerCase();
    for (const entry of ICONS) {
      if (entry.keys.some(k => lower.includes(k))) return entry;
    }
    const fallback = isDir ? FOLDER_ICON : DEFAULT_ICON;
    return { ...fallback, color: hashColor(name) };
  }

  function toTitle(name) {
    return name
      .replace(/\.(html?|htm)$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim();
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const SKIP_FILES = new Set(['index.html', 'readme.md', 'license', 'license.md', '_config.yml', 'cname', '.nojekyll', '404.html']);
  const SKIP_DIRS  = new Set(['assets', 'css', 'js', 'images', 'img', 'static', 'node_modules', '.github', '.git', 'fonts']);

  function detectRepo() {
    const repoOverride = document.querySelector('meta[name="github-repo"]');
    if (repoOverride && repoOverride.content.includes('/')) {
      const [owner, repo] = repoOverride.content.trim().split('/');
      return { owner, repo };
    }
    const userOverride = document.querySelector('meta[name="github-user"]');
    const host = window.location.hostname;
    const owner = (userOverride && userOverride.content.trim())
      ? userOverride.content.trim()
      : (host.endsWith('.github.io') ? host.split('.')[0] : null);
    if (!owner) return null;
    const parts = window.location.pathname.split('/').filter(Boolean);
    const repo = parts.length > 0 ? parts[0] : (owner + '.github.io');
    return { owner, repo };
  }

  function showStatus(msg, isError) {
    status.textContent = msg;
    status.className = 'status' + (isError ? ' error' : '');
  }

  async function loadItems() {
    const info = detectRepo();
    if (!info) {
      showStatus('Could not detect a GitHub username from this URL. Set <meta name="github-user" content="your-username"> in the page head.', true);
      return;
    }

    try {
      const res = await fetch('https://api.github.com/repos/' + info.owner + '/' + info.repo + '/contents/');
      if (!res.ok) {
        if (res.status === 403) {
          showStatus('GitHub API rate limit reached. Try refreshing again in a little while.', true);
        } else if (res.status === 404) {
          showStatus('Repository "' + info.owner + '/' + info.repo + '" wasn\'t found, or isn\'t public.', true);
        } else {
          showStatus('Could not load the repository contents right now.', true);
        }
        return;
      }

      const contents = await res.json();
      const items = contents.filter(item => {
        const lower = item.name.toLowerCase();
        if (item.type === 'file') {
          if (SKIP_FILES.has(lower)) return false;
          return /\.html?$/i.test(item.name);
        }
        if (item.type === 'dir') {
          if (SKIP_DIRS.has(lower) || lower.startsWith('.')) return false;
          return true;
        }
        return false;
      }).sort((a, b) => a.name.localeCompare(b.name));

      if (items.length === 0) {
        showStatus('No pages here yet.', false);
        return;
      }

      status.textContent = '';
      synced.hidden = false;
      syncedText.textContent = items.length + (items.length === 1 ? ' item' : ' items');

      grid.innerHTML = items.map(item => {
        const isDir = item.type === 'dir';
        const href = isDir ? encodeURIComponent(item.name) + '/' : encodeURIComponent(item.name);
        const title = escapeHtml(toTitle(item.name));
        const icon = pickIcon(item.name, isDir);
        const sub = isDir ? 'Folder' : 'Web tool';
        return '<a class="tile" style="--glow:var(--' + icon.color + ');--glow-soft:var(--' + icon.color + '-soft)" href="' + href + '" target="_blank" rel="noopener noreferrer">' +
                 '<span class="icon-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + icon.svg + '</svg></span>' +
                 '<span class="eyebrow">' + icon.label + '</span>' +
                 '<p class="tile-title">' + title + '</p>' +
                 '<p class="tile-sub">' + sub + '</p>' +
               '</a>';
      }).join('');

    } catch (err) {
      showStatus('Something went wrong loading the repository. Check your connection and try again.', true);
    }
  }

  loadItems();
})();
</script>

</body>
</html>

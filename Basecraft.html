/* A standalone search-and-pick modal, used by the home screen's "Edit X"
   tiles (there's no "current" record to jump to, so ask first). Reuses the
   same multi-field search as the link picker (linkSearchText) so e.g. typing
   a surname finds the right client. Picking a row opens it in recordModal,
   stacked on top like the reverse-link rows do. */
function pickRecordModal(tid){
  const t=Store.table(tid);
  if(!t)return;
  const label=singularize(t.name);
  openModal({
    title:'Edit '+label,
    body:`<div class="search">${ic('search',16)}<input id="pq" type="search" placeholder="Search ${esc(t.name.toLowerCase())}" autocomplete="off"></div><div class="meta" id="pMeta" style="padding-left:0"></div><div id="pList"></div>`,
    onMount(el){
      const q=$('#pq',el);
      function draw(){
        const query=q.value.trim().toLowerCase();
        let recs=Store.records(t.id);
        const total=recs.length;
        if(query)recs=recs.filter(r=>linkSearchText(t,r).includes(query));
        recs=sortRecs(recs,t.fields[0],'asc',t).slice(0,50);
        $('#pMeta',el).textContent=total?(query?`${recs.length} of ${total}`:`${total} record${total===1?'':'s'}`):'';
        const L=$('#pList',el);
        if(!total){L.className='';L.innerHTML=`<div class="empty"><h2>No records yet</h2><p>Add one from the home screen first.</p></div>`;return;}
        if(!recs.length){L.className='';L.innerHTML='<div class="empty">No matches.</div>';return;}
        L.className='list';
        // rowHtml() tags rows data-act="editRec", which the global click
        // delegate also matches (using route.tableId — wrong here, since
        // we're in a modal over the home screen, not a table screen). Swap
        // the attribute so only this modal's own listener acts on them.
        L.innerHTML=recs.map(r=>rowHtml(t,r)).join('').replaceAll('data-act="editRec"','data-act="pickRec"');
      }
      q.addEventListener('input',draw);
      $('#pList',el).addEventListener('click',e=>{
        const b=e.target.closest('[data-act=pickRec]');
        if(!b)return;
        e.stopPropagation();
        recordModal(t.id,b.dataset.id);
      });
      draw();
      if(window.matchMedia&&matchMedia('(pointer:fine)').matches)q.focus();
    }
  });
}

const TV={};
function tv(t){
  let v=TV[t.id];
  if(!v)v=TV[t.id]={q:'',sf:t.fields[0].id,dir:'asc',selMode:false,sel:new Set()};
  if(!t.fields.some(f=>f.id===v.sf))v.sf=t.fields[0].id;
  return v;
}

function renderTable(app){
  const t=Store.table(route.tableId);
  if(!t){go({name:'home'},true);return;}
  const v=tv(t);
  document.title=t.name+' \u00b7 Base';
  app.innerHTML=hdr(esc(t.name),backBtn('home'),
    v.selMode
      ?`<button class="ib" data-act="selCancel" aria-label="Cancel selection">${ic('x')}</button>`
      :`<button class="ib" data-act="selStart" aria-label="Select records">${ic('check')}</button><button class="ib" data-act="reports" aria-label="Reports">${ic('report')}</button><button class="ib" data-act="setup" aria-label="Table setup">${ic('sliders')}</button><button class="ib pri" data-act="addRec" aria-label="Add record">${ic('plus')}</button>`)
    +warn()
    +`<div class="tools"><div class="search">${ic('search',16)}<input id="q" type="search" placeholder="Search records" value="${esc(v.q)}" autocomplete="off"></div><div class="sortrow"><select id="sf" aria-label="Sort by">${t.fields.map(f=>`<option value="${f.id}" ${f.id===v.sf?'selected':''}>Sort: ${esc(f.name)}</option>`).join('')}</select><button class="btn" data-act="toggleDir" aria-label="Sort direction">${ic(v.dir==='asc'?'up':'down',16)}</button></div></div><div class="meta" id="recMeta"></div><div id="recList"></div><div id="bulkBar"></div>`;
  $('#q').addEventListener('input',e=>{v.q=e.target.value;renderList();});
  $('#sf').addEventListener('change',e=>{v.sf=e.target.value;renderList();});
  renderList();
}

/* Which field is the title, which show as the subtitle line, and which
   dropdown shows as the trailing badge, for a table's record-list rows.
   Falls back to the original automatic behaviour (first field as title,
   next few non-checkbox fields as subtitle, first populated dropdown as
   badge) when the table hasn't configured this (titleField unset) \u2014 so
   existing tables are unaffected until the user opts in via table setup. */
function listColumns(t){
  const tf=t.titleField&&t.fields.some(f=>f.id===t.titleField)?t.fields.find(f=>f.id===t.titleField):t.fields[0];
  const bfConfigured=t.badgeField!==undefined&&t.badgeField!=='';
  const bf=bfConfigured?t.fields.find(f=>f.id===t.badgeField&&f.type==='dropdown'):null;
  let sf;
  if(t.subtitleFields){
    sf=t.subtitleFields.map(id=>t.fields.find(f=>f.id===id)).filter(f=>f&&(!bf||f.id!==bf.id));
  }else{
    const rest=t.fields.filter(f=>f.id!==tf.id);
    const autoBadge=bfConfigured?null:rest.find(f=>f.type==='dropdown'&&f.id!==tf.id);
    sf=rest.filter(f=>f.type!=='checkbox'&&(!autoBadge||f.id!==autoBadge.id)&&(!bf||f.id!==bf.id)).slice(0,3);
    if(!bfConfigured)return{tf,sf,bf:autoBadge};
  }
  return{tf,sf,bf};
}

function rowHtml(t,r,selMode,selected){
  const {tf,sf,bf}=listColumns(t);
  const title=fmtRec(tf,r,t)||'Untitled';
  const sub=sf.filter(f=>f.type==='formula'||!isEmpty(r.v[f.id])).map(f=>fmtRec(f,r,t)).filter(s=>s!=='').join(' \u00b7 ');
  const badgeVal=bf?(bf.type==='formula'?fmtRec(bf,r,t):r.v[bf.id]):null;
  const act=selMode?'selToggle':'editRec';
  return `<button class="rec${selected?' sel':''}" data-act="${act}" data-id="${r.id}">${selMode?`<span class="selbox">${ic('check',14)}</span>`:''}<div class="m"><div class="t">${esc(title)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>${(!selMode&&!isEmpty(badgeVal))?`<span class="badge">${esc(badgeVal)}</span>`:''}</button>`;
}

function renderList(){
  const t=Store.table(route.tableId);
  if(!t)return;
  const v=tv(t);
  let recs=Store.records(t.id);
  const total=recs.length;
  const q=v.q.trim().toLowerCase();
  if(q)recs=recs.filter(r=>recText(t,r).includes(q));
  recs=sortRecs(recs,t.fields.find(f=>f.id===v.sf),v.dir,t);
  $('#recMeta').textContent=total?(q?`${recs.length} of ${total} records`:`${total} record${total===1?'':'s'}`):'';
  const L=$('#recList');
  if(!total){
    L.className='';
    L.innerHTML=`<div class="empty"><h2>Add your first record</h2><p>Tap the plus button to start.</p><button class="btn pri" data-act="addRec">${ic('plus',16)} Add record</button></div>`;
    renderBulkBar(t,[]);
    return;
  }
  if(!recs.length){L.className='';L.innerHTML='<div class="empty">No records match your search.</div>';renderBulkBar(t,[]);return;}
  L.className='list';
  L.innerHTML=recs.map(r=>rowHtml(t,r,v.selMode,v.sel.has(r.id))).join('');
  renderBulkBar(t,recs);
}

/* Bottom action bar shown while a table's list is in selection mode (toggled
   via the header's Select button). Shows how many of the currently-visible
   (filtered) records are selected, a select-all/none toggle, and the bulk
   actions themselves. Selection (tv(t).sel) is a Set of record ids and
   persists across a re-render (e.g. while typing in the field-value modal)
   but is cleared whenever selection mode is turned off. */
function renderBulkBar(t,visibleRecs){
  const v=tv(t);
  const bar=$('#bulkBar');
  if(!bar)return;
  if(!v.selMode){bar.className='';bar.innerHTML='';return;}
  bar.className='bulkbar';
  const n=v.sel.size;
  const allVisibleSelected=visibleRecs.length>0&&visibleRecs.every(r=>v.sel.has(r.id));
  bar.innerHTML=`<span class="cnt">${n} selected</span><button class="btn" type="button" data-act="selAll">${allVisibleSelected?'None':'All'}</button><button class="btn" type="button" data-act="selSetField" ${n?'':'disabled'}>${ic('edit',16)} Set field</button><button class="btn dn" type="button" data-act="selDelete" ${n?'':'disabled'}>${ic('trash',16)} Delete</button>`;
}

/* ===== record modal ===== */
function recordModal(tid,rid,prefill){
  const t=Store.table(tid);
  const rec=rid?Store.records(tid).find(r=>r.id===rid):null;
  const v=rec?rec.v:(prefill||{});
  const inputs=t.fields.map(f=>{
    const id='f_'+f.id,val=v[f.id];
    const lab=`<label for="${id}">${esc(f.name)}${f.required?' <span class="req">*</span>':''}</label>`;
    let inp;
    if(f.type==='checkbox')return `<div class="fld"><label class="chk"><input id="${id}" type="checkbox" ${val?'checked':''}> ${esc(f.name)}</label></div>`;
    if(f.type==='longtext')inp=`<textarea id="${id}" rows="3">${esc(isEmpty(val)?'':val)}</textarea>`;
    else if(f.type==='number')inp=`<input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(isEmpty(val)?'':val)}">`;
    else if(f.type==='date')inp=`<input id="${id}" type="date" value="${esc(isEmpty(val)?'':val)}">`;
    else if(f.type==='dropdown'){
      const opts=[...f.options];
      if(!isEmpty(val)&&!opts.includes(val))opts.push(val);
      inp=`<select id="${id}"><option value=""></option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }else if(f.type==='link'){
      const lt=Store.table(f.linkTable);
      const label=lt?linkLabel(f,val):'(table missing)';
      inp=`<div class="linkpick" data-fid="${f.id}"><input id="${id}" type="text" autocomplete="off" placeholder="${lt?'Search '+esc(lt.name):''}" value="${esc(isEmpty(val)?'':label)}" data-val="${esc(isEmpty(val)?'':val)}" ${lt?'':'disabled'}><div class="lpmenu" hidden></div></div>`;
    }else if(f.type==='lookup'){
      const viaField=t.fields.find(x=>x.id===f.via);
      const srcTable=viaField?Store.table(viaField.linkTable):null;
      const srcField=srcTable?srcTable.fields.find(x=>x.id===f.srcField):null;
      const display=val&&!isEmpty(val.value)?(val.label!==undefined?val.label:String(val.value)):'';
      return `<div class="fld"><label>${esc(f.name)}</label><input type="text" value="${esc(display)}" disabled data-lookup="${f.id}"><p class="hint" style="margin-top:4px">${srcField?'Pulled from '+esc(srcTable.name)+' → '+esc(srcField.name):'Source field missing'}</p></div>`;
    }else if(f.type==='autonum'){
      return `<div class="fld"><label>${esc(f.name)}</label><input type="text" value="${rec&&!isEmpty(val)?esc(String(val)):'Assigned when saved'}" disabled></div>`;
    }else if(f.type==='formula'){
      return `<div class="fld"><label>${esc(f.name)}</label><input type="text" value="" disabled data-formula="${f.id}"><p class="hint" style="margin-top:4px">Calculated automatically from other fields.</p></div>`;
    }else if(f.type==='multiselect'){
      const sel=Array.isArray(val)?val:[];
      const opts=[...f.options];
      sel.forEach(o=>{if(!opts.includes(o))opts.push(o);});
      return `<div class="fld">${lab}<div class="chips" id="${id}" data-msf="${f.id}">${opts.map(o=>`<button type="button" class="chip ${sel.includes(o)?'on':''}" data-msopt="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="err" data-e="${f.id}"></div></div>`;
    }else inp=`<input id="${id}" type="text" value="${esc(isEmpty(val)?'':val)}" autocomplete="off">`;
    return `<div class="fld">${lab}${inp}<div class="err" data-e="${f.id}"></div></div>`;
  }).join('');
  const revLinks=rec?reverseLinks(tid,rec.id):[];
  const revHtml=revLinks.length?`<div class="revlinks">${revLinks.map(rl=>`<div class="revgroup"><div class="lab">${esc(rl.table.name)} (${rl.recs.length})</div>${rl.recs.map(rr=>{
    const f0=rl.table.fields[0];
    const title=fmtRec(f0,rr,rl.table)||'Untitled';
    return `<button type="button" class="rec revrow" data-revtable="${rl.table.id}" data-revrec="${rr.id}"><div class="m"><div class="t">${esc(title)}</div></div>${ic('chev',16)}</button>`;
  }).join('')}</div>`).join('')}</div>`:'';
  openModal({
    title:rec?'Edit record':'Add record',
    body:`<form id="rf" novalidate>${inputs}<div class="err" id="rerr"></div></form>${revHtml}`,
    foot:`${rec?`<button class="btn dn" type="button" data-del>${ic('trash',16)} Delete</button><button class="ib" type="button" data-dup aria-label="Duplicate">${ic('copy',18)}</button>`:''}<span class="sp"></span><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="submit" form="rf">Save</button>`,
    onMount(el){
      // Opens the linked record ON TOP of this one (stacked, like any nested
      // modal) rather than closing this one first — closing first would pop
      // this modal's history entry and then push a new one for the linked
      // record, discarding that entry, so hardware back would skip past this
      // record straight to the table underneath instead of returning here.
      $$('.revrow',el).forEach(b=>b.onclick=()=>{
        const rtid=b.dataset.revtable,rrid=b.dataset.revrec;
        recordModal(rtid,rrid);
      });
      if(window.matchMedia&&matchMedia('(pointer:fine)').matches&&!rec){const first=$('input,select,textarea',el);if(first&&first.type!=='checkbox')first.focus();}
      $('[data-cancel]',el).onclick=()=>closeN(1);
      const del=$('[data-del]',el);
      if(del)del.onclick=()=>{
        const f0=t.fields[0];
        const nm=fmtRec(f0,rec,t)||'this record';
        const blockers=reverseLinks(tid,rec.id);
        if(blockers.length){
          blockedModal('Can\u2019t delete',`\u201c${nm}\u201d is linked from ${reverseLinkSummary(tid,rec.id)}. Remove or change those links first, then delete it.`);
          return;
        }
        confirmModal({title:'Delete record',msg:`Delete \u201c${nm}\u201d?`,onYes:()=>{
          closeN(2,()=>{deleteRecordChecked(tid,rid,{onDeleted:()=>render()});});
        }});
      };
      const dup=$('[data-dup]',el);
      if(dup)dup.onclick=()=>{
        // Copy every value except unique fields (which would collide instantly
        // with the record just duplicated) and lookup fields (they recompute
        // live from whichever record the link field ends up pointing at).
        const pv={};
        t.fields.forEach(f=>{
          if(f.type==='lookup'||f.type==='autonum'||f.type==='formula'||f.unique)return;
          pv[f.id]=rec.v[f.id];
        });
        closeN(1,()=>recordModal(tid,null,pv));
      };
      // Lookup fields snapshot from their governing link field. lookupVals holds
      // the live computed {value,label} per lookup field id, recalculated whenever
      // the link field it depends on changes (see setupLinkPicker's onChange).
      const lookupVals={};
      t.fields.filter(f=>f.type==='lookup').forEach(f=>{
        const viaField=t.fields.find(x=>x.id===f.via);
        const initLinkVal=viaField?v[viaField.id]:undefined;
        lookupVals[f.id]=rec?(v[f.id]||null):computeLookup(f,initLinkVal,t);
      });
      function refreshLookupsFor(linkFieldId,newLinkVal){
        t.fields.filter(f=>f.type==='lookup'&&f.via===linkFieldId).forEach(f=>{
          lookupVals[f.id]=computeLookup(f,newLinkVal,t);
          const dispInp=$(`[data-lookup="${f.id}"]`,el);
          if(dispInp)dispInp.value=lookupVals[f.id]?(lookupVals[f.id].label!==undefined?lookupVals[f.id].label:String(lookupVals[f.id].value)):'';
        });
        if(typeof refreshFormulas==='function')refreshFormulas();
      }
      $$('.linkpick',el).forEach(wrap=>setupLinkPicker(wrap,t.fields.find(f=>f.id===wrap.dataset.fid),refreshLookupsFor));
      // Multi-select fields render as a chip group (no <select multiple>, to
      // match the rest of the app's chip-toggle pattern used in Reports).
      // multiVals holds the current selection per field id, read back on submit.
      const multiVals={};
      t.fields.filter(f=>f.type==='multiselect').forEach(f=>{multiVals[f.id]=Array.isArray(v[f.id])?[...v[f.id]]:[];});
      $$('.chips[data-msf]',el).forEach(wrap=>{
        wrap.addEventListener('click',e=>{
          const b=e.target.closest('[data-msopt]');if(!b)return;
          const fid=wrap.dataset.msf,opt=b.dataset.msopt;
          const arr=multiVals[fid];
          const i=arr.indexOf(opt);
          if(i>=0)arr.splice(i,1);else arr.push(opt);
          b.classList.toggle('on');
          refreshFormulas();
        });
      });
      // Formula fields are read-only and recomputed live from whatever the
      // other fields on THIS form currently hold, so they update as the
      // person types rather than only reflecting the last-saved record.
      const formulaFields=t.fields.filter(f=>f.type==='formula');
      function currentFormValues(){
        const cv={};
        t.fields.forEach(f=>{
          if(f.type==='formula')return;
          if(f.type==='lookup'){cv[f.id]=lookupVals[f.id];return;}
          if(f.type==='multiselect'){cv[f.id]=multiVals[f.id];return;}
          if(f.type==='autonum'){cv[f.id]=rec?rec.v[f.id]:null;return;}
          const inp=$('#f_'+f.id,el);
          if(!inp){cv[f.id]=v[f.id];return;}
          if(f.type==='checkbox')cv[f.id]=inp.checked;
          else if(f.type==='link')cv[f.id]=inp.dataset.val||'';
          else cv[f.id]=inp.value;
        });
        return cv;
      }
      function refreshFormulas(){
        if(!formulaFields.length)return;
        const tmpRec={v:currentFormValues()};
        formulaFields.forEach(f=>{
          const dispInp=$(`[data-formula="${f.id}"]`,el);
          if(!dispInp)return;
          const result=computeFormula(f,tmpRec,t);
          dispInp.value=isEmpty(result)?'':formatNumber(f,result,false);
        });
      }
      refreshFormulas();
      if(formulaFields.length){
        el.addEventListener('input',refreshFormulas);
        el.addEventListener('change',refreshFormulas);
      }
      $('#rf',el).addEventListener('submit',e=>{
        e.preventDefault();
        $$('.err',el).forEach(x=>x.textContent='');
        const nv={};let ok=true,any=false;
        t.fields.forEach(f=>{
          if(f.type==='lookup'){
            nv[f.id]=lookupVals[f.id]||null;
            if(nv[f.id]&&!isEmpty(nv[f.id].value))any=true;
            return;
          }
          if(f.type==='autonum'){
            // Assigned once, on first save, from the table's own counter —
            // never editable and never reassigned on later edits.
            nv[f.id]=rec?rec.v[f.id]:null;
            if(!isEmpty(nv[f.id]))any=true;
            return;
          }
          if(f.type==='formula'){
            // Nothing is stored — always computed live from the other fields
            // (see fmtRec/computeFormula) so it can never drift out of date.
            return;
          }
          if(f.type==='multiselect'){
            nv[f.id]=multiVals[f.id];
            if(nv[f.id].length)any=true;
            if(f.required&&!nv[f.id].length){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Required';}
            return;
          }
          const inp=$('#f_'+f.id,el);
          let val;
          if(f.type==='checkbox'){val=inp.checked;if(val)any=true;}
          else if(f.type==='link'){
            val=inp.dataset.val||'';
            if(inp.value.trim()==='')val='';
            if(!isEmpty(val))any=true;
            if(f.required&&isEmpty(val)){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Required';}
          }else{
            if(f.type==='number')val=inp.value===''?'':Number(inp.value);
            else val=inp.value.trim();
            if(!isEmpty(val))any=true;
            if(f.required&&isEmpty(val)){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Required';}
          }
          nv[f.id]=val;
        });
        // Uniqueness: compare this record's value against every OTHER record
        // in the table for each field marked unique. Case-insensitive for
        // text-like fields, numeric for number fields; blanks never collide
        // with each other (a field can be unique and still optional).
        t.fields.filter(f=>f.unique).forEach(f=>{
          const val=nv[f.id];
          if(isEmpty(val))return;
          const key=f.type==='number'?Number(val):String(val).trim().toLowerCase();
          const clash=Store.records(tid).some(other=>{
            if(rec&&other.id===rec.id)return false;
            const ov=other.v[f.id];
            if(isEmpty(ov))return false;
            const okey=f.type==='number'?Number(ov):String(ov).trim().toLowerCase();
            return okey===key;
          });
          if(clash){ok=false;$(`[data-e="${f.id}"]`,el).textContent='Already used by another record';}
        });
        if(ok&&!any){ok=false;$('#rerr',el).textContent='Enter at least one value.';}
        if(!ok)return;
        // Auto-number fields get the table's next counter value, but only on
        // first save (an edit keeps whatever it was originally assigned,
        // handled above by copying rec.v[f.id] through untouched).
        const autonumFields=t.fields.filter(f=>f.type==='autonum');
        if(!rec&&autonumFields.length){
          const fresh=Store.table(tid);
          let seq=fresh.autonumSeq||0;
          autonumFields.forEach(f=>{seq++;nv[f.id]=seq;});
          Store.saveTable(Object.assign({},fresh,{autonumSeq:seq}));
        }
        const now=new Date().toISOString();
        const r=rec?Object.assign({},rec,{v:nv,updated:now}):{id:uid(),v:nv,created:now,updated:now};
        Store.saveRecord(tid,r);
        closeN(1);render();toast(rec?'Saved':'Record added');
      });
    }
  });
}

/* Wires a link field's text input to a filtered dropdown of the target table's
   records. Selecting an option sets data-val (the record id) on the input;
   editing the text without picking a new option clears data-val on blur.
   Search matches against every field on the linked table (linkSearchText),
   not just the title field, so e.g. a surname matches even when the record
   is titled by first name. onChange(fieldId, newLinkedRecordId) fires after
   a selection or a clear, so dependent Lookup fields can refresh. */
function setupLinkPicker(wrap,f,onChange){
  const lt=Store.table(f.linkTable);
  if(!lt)return;
  const inp=$('input',wrap),menu=$('.lpmenu',wrap);
  const opts=()=>Store.records(lt.id).map(r=>({id:r.id,label:fmtRec(lt.fields[0],r,lt)||'Untitled',search:linkSearchText(lt,r)})).sort((a,b)=>a.label.localeCompare(b.label,'en-GB',{sensitivity:'base'}));
  function draw(){
    const q=inp.value.trim().toLowerCase();
    const list=opts().filter(o=>!q||o.search.includes(q)).slice(0,50);
    menu.innerHTML=list.length?list.map(o=>`<button type="button" class="lpopt" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join(''):`<div class="lpempty">No matches</div>`;
    menu.hidden=false;
  }
  inp.addEventListener('focus',draw);
  inp.addEventListener('input',()=>{
    if(inp.dataset.val){inp.dataset.val='';if(onChange)onChange(f.id,'');}
    draw();
  });
  menu.addEventListener('mousedown',e=>{
    const b=e.target.closest('.lpopt');if(!b)return;
    e.preventDefault();
    inp.value=b.textContent;inp.dataset.val=b.dataset.id;
    menu.hidden=true;
    if(onChange)onChange(f.id,b.dataset.id);
  });
  inp.addEventListener('blur',()=>{
    setTimeout(()=>{
      menu.hidden=true;
      if(!inp.dataset.val)inp.value='';
    },150);
  });
}

/* ===== table setup modal ===== */
function tableModal(tid){
  const orig=tid?Store.table(tid):null;
  const hasRecs=!!tid&&Store.records(tid).length>0;
  const draft=orig
    ?{name:orig.name,fields:orig.fields.map(f=>({id:f.id,name:f.name,type:f.type,required:!!f.required,unique:!!f.unique,options:[...(f.options||[])],linkTable:f.linkTable||'',via:f.via||'',srcField:f.srcField||'',numFormat:f.numFormat||'',formula:f.formula||'',isNew:false})),titleField:orig.titleField||'',subtitleFields:orig.subtitleFields?[...orig.subtitleFields]:null,badgeField:orig.badgeField!==undefined?orig.badgeField:''}
    :{name:'',fields:[{id:uid(),name:'Name',type:'text',required:true,unique:false,options:[],linkTable:'',via:'',srcField:'',numFormat:'',formula:'',isNew:true}],titleField:'',subtitleFields:null,badgeField:''};
  const otherTables=Store.tables().filter(x=>x.id!==tid);
  openModal({
    title:orig?'Table setup':'New table',
    body:`<div class="fld"><label for="tn">Table name</label><input id="tn" type="text" value="${esc(draft.name)}" placeholder="Clients" autocomplete="off"></div><div class="lab">Fields</div><div id="fl"></div><button class="btn" id="af" type="button">${ic('plus',16)} Add field</button><div class="err" id="terr"></div>${hasRecs?'<p class="hint">Field types can\'t be changed once a table has records. Removing a field deletes its data.</p>':''}<div class="lab" style="margin-top:16px">List display</div><div id="lcCard"></div>`,
    foot:`${orig?`<button class="btn dn" type="button" data-deltable>${ic('trash',16)} Delete table</button>`:''}<span class="sp"></span><button class="btn" type="button" data-cancel>Cancel</button><button class="btn pri" type="button" data-save>Save</button>`,
    onMount(el){
      const fl=$('#fl',el);
      function renderFields(){
        const last=draft.fields.length-1;
        const linkFields=draft.fields.filter(x=>x.type==='link'&&x.linkTable);
        fl.innerHTML=draft.fields.map((f,i)=>{
          const locked=!f.isNew&&hasRecs;
          const typeOpts=Object.keys(TYPES).filter(k=>(k!=='link'||otherTables.length)&&(k!=='lookup'||linkFields.length));
          let lookupUi='';
          if(f.type==='lookup'){
            const viaField=linkFields.find(x=>x.id===f.via)||linkFields[0];
            if(viaField&&!f.via)f.via=viaField.id;
            const srcTable=viaField?Store.table(viaField.linkTable):null;
            const srcOpts=srcTable?lookupSourceFields(srcTable):[];
            lookupUi=`<div class="fr2"><select class="flvia" ${locked?'disabled':''}>${linkFields.map(x=>`<option value="${x.id}" ${x.id===f.via?'selected':''}>via ${esc(x.name)}</option>`).join('')}</select><select class="flsrc" ${locked?'disabled':''}><option value="">Choose a field…</option>${srcOpts.map(x=>`<option value="${x.id}" ${x.id===f.srcField?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
          }
          const showReq=f.type!=='checkbox'&&f.type!=='lookup'&&f.type!=='autonum'&&f.type!=='formula';
          const showUniq=showReq&&f.type!=='longtext'&&f.type!=='multiselect';
          const numFmtUi=(f.type==='number'||f.type==='formula')?`<div class="fr2"><select class="fnf" ${locked?'':''}><option value="" ${!f.numFormat?'selected':''}>Plain number</option><option value="currency" ${f.numFormat==='currency'?'selected':''}>Currency (£)</option><option value="percent" ${f.numFormat==='percent'?'selected':''}>Percentage (%)</option></select></div>`:'';
          let formulaUi='';
          if(f.type==='formula'){
            const refFields=draft.fields.filter(x=>x.id!==f.id&&(x.type==='number'||x.type==='autonum'||x.type==='formula'||x.type==='lookup'));
            formulaUi=`<input class="ffm" type="text" value="${esc(f.formula)}" placeholder="e.g. {Value} * 1.2" autocomplete="off">${refFields.length?`<div class="chips" style="margin-top:6px">${refFields.map(x=>`<button type="button" class="chip" data-insref="${esc(x.name)}">${esc(x.name||'(unnamed)')}</button>`).join('')}</div>`:''}<p class="hint" style="margin:4px 0 0">Reference other fields as {Field Name}. Supports + − × ÷ and parentheses.</p><div class="err" data-ferr></div>`;
          }
          return `<div class="frow" data-i="${i}"><div class="fr1"><input class="fn" value="${esc(f.name)}" placeholder="Field name" autocomplete="off"><button class="ib" type="button" data-mv="-1" aria-label="Move up" ${i===0?'disabled':''}>${ic('up',16)}</button><button class="ib" type="button" data-mv="1" aria-label="Move down" ${i===last?'disabled':''}>${ic('down',16)}</button><button class="ib" type="button" data-rm aria-label="Remove field">${ic('trash',16)}</button></div><div class="fr2"><select class="ft" ${locked?'disabled':''}>${typeOpts.map(k=>`<option value="${k}" ${k===f.type?'selected':''}>${TYPES[k]}</option>`).join('')}</select>${showReq?`<label class="chk"><input type="checkbox" class="fq" ${f.required?'checked':''}> Required</label>`:''}${showUniq?`<label class="chk"><input type="checkbox" class="fu" ${f.unique?'checked':''}> Unique</label>`:''}</div>${numFmtUi}${(f.type==='dropdown'||f.type==='multiselect')?`<textarea class="fo" rows="2" placeholder="Options, one per line">${esc(f.options.join('\n'))}</textarea>`:''}${f.type==='link'?`<select class="flt2" ${locked?'disabled':''}><option value="">Choose a table…</option>${otherTables.map(x=>`<option value="${x.id}" ${x.id===f.linkTable?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:''}${f.type==='autonum'?`<p class="hint" style="margin:0">Assigns each new record the next number automatically (1, 2, 3…). Read-only.</p>`:''}${formulaUi}${lookupUi}</div>`;
        }).join('');
      }
      function sync(){
        draft.name=$('#tn',el).value;
        $$('.frow',el).forEach(row=>{
          const f=draft.fields[+row.dataset.i];
          f.name=$('.fn',row).value;
          const q=$('.fq',row);f.required=q?q.checked:false;
          const u=$('.fu',row);f.unique=u?u.checked:false;
          const o=$('.fo',row);if(o)f.options=o.value.split('\n').map(s=>s.trim()).filter(Boolean);
          const nf=$('.fnf',row);if(nf)f.numFormat=nf.value;
          const fm=$('.ffm',row);if(fm)f.formula=fm.value;
          const lk=$('.flt2',row);if(lk)f.linkTable=lk.value;
          const via=$('.flvia',row);if(via)f.via=via.value;
          const src=$('.flsrc',row);if(src)f.srcField=src.value;
          const ty=$('.ft',row);if(ty&&!ty.disabled)f.type=ty.value;
        });
      }
      // "List display" card: which field is the title, up to 3 as the
      // subtitle line, and which dropdown (if any) shows as the trailing
      // badge, on this table's record-list rows (rowHtml). Defaults (null
      // subtitleFields / empty titleField+badgeField) reproduce the original
      // automatic behaviour, so an unconfigured table looks the same as before.
      const lc=$('#lcCard',el);
      function renderListCols(){
        const dropdowns=draft.fields.filter(f=>f.type==='dropdown');
        const tfId=draft.titleField&&draft.fields.some(f=>f.id===draft.titleField)?draft.titleField:draft.fields[0].id;
        const subIds=draft.subtitleFields?draft.subtitleFields.filter(id=>draft.fields.some(f=>f.id===id)&&id!==draft.badgeField):[];
        // The badge field is left out of the subtitle chip choices entirely —
        // showing the same dropdown value twice (once as text, once as the
        // badge) would just look like a glitch, not a deliberate choice.
        const subChoices=draft.fields.filter(f=>f.id!==tfId&&f.id!==draft.badgeField);
        lc.innerHTML=`<div class="card" style="margin:0 0 8px"><div class="fld" style="margin-bottom:10px"><label for="lctf">Title</label><select id="lctf">${draft.fields.map(f=>`<option value="${f.id}" ${f.id===tfId?'selected':''}>${esc(f.name||'(unnamed)')}</option>`).join('')}</select></div><div class="fld" style="margin-bottom:${dropdowns.length?'10px':'0'}"><div class="lab">Subtitle (choose up to 3)</div><div class="chips">${subChoices.map(f=>`<button type="button" class="chip ${subIds.includes(f.id)?'on':''}" data-subf="${f.id}">${esc(f.name||'(unnamed)')}</button>`).join('')}</div></div>${dropdowns.length?`<div class="fld" style="margin-bottom:0"><label for="lcbf">Badge</label><select id="lcbf"><option value="">None</option>${dropdowns.map(f=>`<option value="${f.id}" ${f.id===draft.badgeField?'selected':''}>${esc(f.name||'(unnamed)')}</option>`).join('')}</select></div>`:''}</div>`;
        $('#lctf',lc).onchange=e=>{draft.titleField=e.target.value;if(draft.subtitleFields)draft.subtitleFields=draft.subtitleFields.filter(id=>id!==e.target.value);renderListCols();};
        const bfSel=$('#lcbf',lc);if(bfSel)bfSel.onchange=e=>{
          draft.badgeField=e.target.value;
          if(draft.subtitleFields)draft.subtitleFields=draft.subtitleFields.filter(id=>id!==draft.badgeField);
          renderListCols();
        };
        $$('.chip',lc).forEach(b=>b.onclick=()=>{
          if(!draft.subtitleFields)draft.subtitleFields=subIds;
          const id=b.dataset.subf,i=draft.subtitleFields.indexOf(id);
          if(i>=0)draft.subtitleFields.splice(i,1);
          else{if(draft.subtitleFields.length>=3){toast('Choose up to 3');return;}draft.subtitleFields.push(id);}
          renderListCols();
        });
      }
      renderFields();
      renderListCols();
      fl.addEventListener('click',e=>{
        const mv=e.target.closest('[data-mv]');
        const rm=e.target.closest('[data-rm]');
        const insref=e.target.closest('[data-insref]');
        if(insref){
          const row=insref.closest('.frow'),inp=$('.ffm',row);
          const token='{'+insref.dataset.insref+'}';
          const s=inp.selectionStart||inp.value.length,en=inp.selectionEnd||inp.value.length;
          inp.value=inp.value.slice(0,s)+token+inp.value.slice(en);
          inp.focus();inp.selectionStart=inp.selectionEnd=s+token.length;
          return;
        }
        if(mv){
          sync();
          const i=+mv.closest('.frow').dataset.i,j=i+ +mv.dataset.mv;
          if(j<0||j>=draft.fields.length)return;
          const tmp=draft.fields[i];draft.fields[i]=draft.fields[j];draft.fields[j]=tmp;
          renderFields();renderListCols();
        }else if(rm){
          sync();
          if(draft.fields.length===1){toast('A table needs at least one field');return;}
          draft.fields.splice(+rm.closest('.frow').dataset.i,1);
          renderFields();renderListCols();
        }
      });
      fl.addEventListener('change',e=>{
        if(e.target.matches('.ft,.flt2,.flvia')){
          if(e.target.classList.contains('flvia')){
            sync();
            const row=e.target.closest('.frow');
            draft.fields[+row.dataset.i].srcField='';
          }else sync();
          renderFields();renderListCols();
        }
      });
      fl.addEventListener('blur',e=>{if(e.target.classList&&e.target.classList.contains('fn')){sync();renderListCols();}},true);
      $('#af',el).onclick=()=>{
        sync();
        draft.fields.push({id:uid(),name:'',type:'text',required:false,unique:false,options:[],linkTable:'',via:'',srcField:'',numFormat:'',formula:'',isNew:true});
        renderFields();renderListCols();
        const ins=$$('.fn',el);ins[ins.length-1].focus();
      };
      $('[data-cancel]',el).onclick=()=>closeN(1);
      const dt=$('[data-deltable]',el);
      if(dt)dt.onclick=()=>{
        const n=Store.records(tid).length;
        const blockers=tableIsLinkedFrom(tid).filter(b=>b.count>0);
        if(blockers.length){
          blockedModal('Can\u2019t delete',`\u201c${orig.name}\u201d is linked from ${blockers.map(b=>`${b.count} ${b.count===1?singularize(b.table.name):b.table.name.toLowerCase()}`).join(', ')}. Remove those link fields or their values first, then delete it.`);
          return;
        }
        confirmModal({title:'Delete table',msg:`Delete \u201c${orig.name}\u201d and its ${n} record${n===1?'':'s'}? This can't be undone.`,onYes:()=>{
          Store.deleteTable(tid);delete TV[tid];delete REP[tid];
          closeN(modals.length,()=>{go({name:'home'});toast('Table deleted');});
        }});
      };
      $('[data-save]',el).onclick=()=>{
        sync();
        const err=$('#terr',el);err.textContent='';
        const name=draft.name.trim();
        if(!name){err.textContent='Enter a table name.';return;}
        const names=draft.fields.map(f=>f.name.trim().toLowerCase());
        if(names.some(n=>!n)){err.textContent='Every field needs a name.';return;}
        if(new Set(names).size!==names.length){err.textContent='Field names must be different.';return;}
        if(draft.fields.some(f=>(f.type==='dropdown'||f.type==='multiselect')&&!f.options.length)){err.textContent='Add at least one option to each dropdown/multi-select field.';return;}
        if(draft.fields.some(f=>f.type==='link'&&!f.linkTable)){err.textContent='Choose a table for each link field.';return;}
        if(draft.fields.some(f=>f.type==='lookup'&&(!f.via||!f.srcField))){err.textContent='Choose a link and a field to pull in for each lookup field.';return;}
        if(draft.fields.some(f=>f.type==='formula'&&!f.formula.trim())){err.textContent='Enter a formula for each formula field.';return;}
        const badFormula=draft.fields.find(f=>{
          if(f.type!=='formula'||!f.formula.trim())return false;
          try{parseFormula(tokenizeFormula(f.formula));return false;}catch(e){return true;}
        });
        if(badFormula){err.textContent=`The formula for "${badFormula.name.trim()||'that field'}" isn't valid. Check the field names and symbols.`;return;}
        // Turning "Unique" on for a field that already has duplicate values
        // among existing records would silently make the table inconsistent
        // (nothing re-validates old data), so check before allowing it.
        if(tid){
          const dupeField=draft.fields.find(f=>{
            if(!f.unique)return false;
            const seen=new Set();
            for(const r of Store.records(tid)){
              const val=r.v[f.id];
              if(isEmpty(val))continue;
              const key=(f.type==='number'?Number(val):String(val).trim().toLowerCase());
              if(seen.has(key))return true;
              seen.add(key);
            }
            return false;
          });
          if(dupeField){err.textContent=`Some existing records already share the same "${dupeField.name.trim()}" value — fix those before making it unique.`;return;}
        }
        const removed=orig?orig.fields.filter(f=>!draft.fields.some(d=>d.id===f.id)):[];
        const loss=removed.length&&Store.records(tid).some(r=>removed.some(f=>!isEmpty(r.v[f.id])));
        const apply=()=>{
          const t={id:orig?orig.id:uid(),name:name,created:orig?orig.created:new Date().toISOString(),
            titleField:draft.titleField,subtitleFields:draft.subtitleFields,badgeField:draft.badgeField,
            autonumSeq:orig?(orig.autonumSeq||0):0,
            fields:draft.fields.map(f=>({id:f.id,name:f.name.trim(),type:f.type,
              required:(f.type==='checkbox'||f.type==='lookup'||f.type==='autonum'||f.type==='formula')?false:f.required,
              unique:(f.type==='checkbox'||f.type==='lookup'||f.type==='longtext'||f.type==='multiselect'||f.type==='autonum'||f.type==='formula')?false:!!f.unique,
              options:(f.type==='dropdown'||f.type==='multiselect')?f.options:[],
              linkTable:f.type==='link'?f.linkTable:'',via:f.type==='lookup'?f.via:'',srcField:f.type==='lookup'?f.srcField:'',
              numFormat:(f.type==='number'||f.type==='formula')?(f.numFormat||''):'',
              formula:f.type==='formula'?f.formula.trim():''}))};
          Store.saveTable(t);
          if(orig&&removed.length){
            Store.records(tid).forEach(r=>removed.forEach(f=>delete r.v[f.id]));
            Store.commit();
          }
          closeN(modals.length,()=>{
            if(!orig)go({name:'table',tableId:t.id});
            else{render();toast('Saved');}
          });
        };
        if(loss)confirmModal({title:'Remove fields',msg:`Removing ${removed.map(f=>'\u201c'+f.name+'\u201d').join(', ')} deletes its data from existing records.`,label:'Remove',onYes:apply});
        else apply();
      };
    }
  });
}

/* ===== data and backup modal ===== */
function dataModal(){
  openModal({title:'Data and backup',backdrop:true,
    body:`<div class="stack"><button class="btn" type="button" data-exp>${ic('download',16)} Export backup</button><button class="btn" type="button" data-imp>${ic('plus',16)} Import backup</button><button class="btn" type="button" data-smp>${ic('db',16)} Load sample data</button><button class="btn dn" type="button" data-clr>${ic('trash',16)} Delete everything</button></div><p class="hint">Data is stored in this browser only. Export a backup file to keep a copy or move it to another device.</p>`,
    onMount(el){
      $('[data-exp]',el).onclick=()=>{dl(`basecraft-backup-${today()}.json`,Store.exportAll(),'application/json');toast('Backup downloaded');};
      $('[data-imp]',el).onclick=()=>$('#impf').click();
      $('[data-smp]',el).onclick=()=>{loadSample();closeN(1);};
      $('[data-clr]',el).onclick=()=>confirmModal({title:'Delete everything',msg:'This deletes every table, record and saved view in this browser. Export a backup first if you might need it.',label:'Delete everything',onYes:()=>{
        Store.clearAll();Object.keys(TV).forEach(k=>delete TV[k]);Object.keys(REP).forEach(k=>delete REP[k]);
        closeN(modals.length,()=>{go({name:'home'},true);toast('All data deleted');});
      }});
    }
  });
}

$('#impf').addEventListener('change',e=>{
  const file=e.target.files[0];
  e.target.value='';
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o;
    try{o=JSON.parse(rd.result);}catch(x){o=null;}
    if(!o||!Array.isArray(o.tables)||!o.tables.every(t=>t&&t.id&&t.name&&Array.isArray(t.fields))){toast('That file isn\'t a valid backup');return;}
    confirmModal({title:'Import backup',msg:`Replace everything here with this backup (${o.tables.length} table${o.tables.length===1?'':'s'})?`,label:'Replace',danger:false,onYes:()=>{
      Store.importAll(o);Object.keys(TV).forEach(k=>delete TV[k]);Object.keys(REP).forEach(k=>delete REP[k]);
      closeN(modals.length,()=>{go({name:'home'},true);toast('Backup imported');});
    }});
  };
  rd.readAsText(file);
});

function loadSample(){
  if(Store.table('sample_clients')){toast('Sample data is already loaded');return;}
  const F=(name,type,x)=>Object.assign({id:uid(),name:name,type:type,required:false,options:[]},x||{});
  const fs=[F('Name','text',{required:true}),F('City','text'),F('Start date','date'),F('Status','dropdown',{options:['Active','On hold','Closed']}),F('Value','number'),F('VIP','checkbox'),F('Notes','longtext')];
  Store.saveTable({id:'sample_clients',name:'Clients (sample)',fields:fs,created:new Date().toISOString()});
  const rows=[
    ['Harrison & Co','Leeds','2026-01-12','Active',48500,true,'Renewal due in November'],
    ['Brook Property Ltd','Manchester','2026-02-03','Active',125000,false,''],
    ['Carter Holdings','Bristol','2025-11-21','Closed',72000,false,'Completed early'],
    ['Delaney Estates','Birmingham','2026-04-08','On hold',210000,true,'Waiting on valuation'],
    ['Ellis and Partners','Sheffield','2026-05-19','Active',33250,false,''],
    ['Fairview Lettings','Nottingham','2026-06-02','Active',89900,false,'Prefers email contact'],
    ['Grange Developments','York','2026-07-15','On hold',315000,true,''],
    ['Hollis Family Trust','Liverpool','2026-08-27','Active',56000,false,'']
  ];
  const now=new Date().toISOString();
  rows.forEach(row=>{
    const v={};fs.forEach((f,i)=>{v[f.id]=row[i];});
    Store.saveRecord('sample_clients',{id:uid(),v:v,created:now,updated:now});
  });
  render();toast('Sample data loaded');
}

/* ===== reports ===== */
const REP={};
function rs(t){
  let s=REP[t.id];
  if(!s)s=REP[t.id]={viewId:'',fields:t.fields.map(f=>f.id),filters:[],sf:'',dir:'asc'};
  s.fields=s.fields.filter(id=>t.fields.some(f=>f.id===id));
  if(!s.fields.length)s.fields=t.fields.map(f=>f.id);
  s.filters=s.filters.filter(x=>t.fields.some(f=>f.id===x.fid));
  s.filters.forEach(x=>{const f=t.fields.find(y=>y.id===x.fid);if(!OPS[f.type].some(o=>o[0]===x.op)){x.op=OPS[f.type][0][0];x.value='';}});
  if(s.sf&&!t.fields.some(f=>f.id===s.sf))s.sf='';
  if(s.viewId&&!Store.views(t.id).some(v=>v.id===s.viewId))s.viewId='';
  return s;
}

function runReport(t,s){
  const recs=Store.records(t.id).filter(r=>s.filters.every(fl=>match(r,t.fields.find(f=>f.id===fl.fid),fl,t)));
  const sorted=sortRecs(recs,t.fields.find(f=>f.id===s.sf),s.dir,t);
  return {recs:sorted,cols:t.fields.filter(f=>s.fields.includes(f.id))};
}

function fltRow(t,fl,i){
  const f=t.fields.find(x=>x.id===fl.fid);
  let val='';
  if(!noVal(fl.op)){
    if(f.type==='dropdown'||f.type==='multiselect')val=`<select class="fv"><option value=""></option>${f.options.map(o=>`<option ${o===fl.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='link'){
      const lt=Store.table(f.linkTable);
      const opts=lt?Store.records(lt.id).map(r=>({id:r.id,label:fmtRec(lt.fields[0],r,lt)||'Untitled'})).sort((a,b)=>a.label.localeCompare(b.label,'en-GB',{sensitivity:'base'})):[];
      val=`<select class="fv"><option value=""></option>${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===fl.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    else val=`<input class="fv" type="${(f.type==='number'||f.type==='autonum'||f.type==='formula')?'number':f.type==='date'?'date':'text'}" ${(f.type==='number'||f.type==='autonum'||f.type==='formula')?'step="any"':''} value="${esc(fl.value)}" placeholder="Value" autocomplete="off">`;
  }
  return `<div class="flt" data-i="${i}"><select class="ff" aria-label="Field">${t.fields.map(x=>`<option value="${x.id}" ${x.id===f.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select class="fop" aria-label="Condition">${OPS[f.type].map(o=>`<option value="${o[0]}" ${o[0]===fl.op?'selected':''}>${o[1]}</option>`).join('')}</select><button class="ib" type="button" data-rmf aria-label="Remove filter">${ic('x',16)}</button>${val?`<div class="fvw">${val}</div>`:''}</div>`;
}

function updatePreview(t,s){
  const r=runReport(t,s);
  const total=Store.records(t.id).length;
  $('#repMeta').textContent=`${r.recs.length} of ${total} records`+(r.recs.length>100?' \u00b7 showing first 100, downloads include all':'');
  $('#repPrev').innerHTML=r.recs.length
    ?`<table class="rt"><thead><tr>${r.cols.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${r.recs.slice(0,100).map(rec=>`<tr>${r.cols.map(f=>`<td class="${(f.type==='number'||f.type==='autonum'||f.type==='formula')?'num':''}">${esc(fmtRec(f,rec,t))}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    :'<div class="empty" style="padding:24px">No records match.</div>';
}

function renderReports(app){
  const t=Store.table(route.tableId);
  if(!t){go({name:'home'},true);return;}
  const s=rs(t);
  const views=Store.views(t.id);
  document.title='Reports \u00b7 '+t.name;
  app.innerHTML=hdr('Reports: '+esc(t.name),backBtn('backTable'))
    +`<div class="card"><h3>View</h3><select id="rv" aria-label="Saved view"><option value="">New view</option>${views.map(v=>`<option value="${v.id}" ${v.id===s.viewId?'selected':''}>${esc(v.name)}</option>`).join('')}</select><div class="rowbtns"><button class="btn" type="button" id="svv">Save view</button>${s.viewId?'<button class="btn dn" type="button" id="dvv">Delete view</button>':''}</div></div>`
    +`<div class="card"><h3>Fields to include</h3><div class="chips">${t.fields.map(f=>`<button class="chip ${s.fields.includes(f.id)?'on':''}" type="button" data-f="${f.id}">${esc(f.name)}</button>`).join('')}</div></div>`
    +`<div class="card"><h3>Filters</h3><div id="flts"></div><button class="btn" type="button" id="af2">${ic('plus',16)} Add filter</button></div>`
    +`<div class="card"><h3>Sort</h3><div class="sortrow"><select id="rsf" aria-label="Sort by"><option value="">Original order</option>${t.fields.map(f=>`<option value="${f.id}" ${f.id===s.sf?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class="btn" type="button" id="rdir" aria-label="Sort direction">${ic(s.dir==='asc'?'up':'down',16)}</button></div></div>`
    +`<div class="meta" id="repMeta"></div><div class="tblwrap" id="repPrev"></div><div class="actions"><button class="btn" type="button" id="rcsv">${ic('download',16)} CSV</button><button class="btn pri" type="button" id="rprint">${ic('print',16)} Print / PDF</button></div>`;

  const drawFilters=()=>{$('#flts').innerHTML=s.filters.map((fl,i)=>fltRow(t,fl,i)).join('');updatePreview(t,s);};
  drawFilters();

  $('#rv').onchange=e=>{
    const id=e.target.value;
    if(!id){s.viewId='';s.fields=t.fields.map(f=>f.id);s.filters=[];s.sf='';s.dir='asc';}
    else{
      const v=views.find(x=>x.id===id);
      s.viewId=v.id;s.fields=[...v.fields];s.filters=v.filters.map(x=>Object.assign({},x));s.sf=v.sf||'';s.dir=v.dir||'asc';
    }
    renderReports($('#app'));
  };
  $$('.chip',app).forEach(b=>b.onclick=()=>{
    const id=b.dataset.f,i=s.fields.indexOf(id);
    if(i>=0){if(s.fields.length===1){toast('Keep at least one field');return;}s.fields.splice(i,1);}
    else s.fields.push(id);
    renderReports($('#app'));
  });
  $('#af2').onclick=()=>{
    const f=t.fields[0];
    s.filters.push({fid:f.id,op:OPS[f.type][0][0],value:''});
    drawFilters();
  };
  const fe=$('#flts');
  fe.addEventListener('change',e=>{
    const row=e.target.closest('.flt');if(!row)return;
    const fl=s.filters[+row.dataset.i];
    if(e.target.classList.contains('ff')){
      fl.fid=e.target.value;
      const f=t.fields.find(x=>x.id===fl.fid);
      fl.op=OPS[f.type][0][0];fl.value='';
      drawFilters();
    }else if(e.target.classList.contains('fop')){
      fl.op=e.target.value;
      if(noVal(fl.op))fl.value='';
      drawFilters();
    }else if(e.target.classList.contains('fv')){
      fl.value=e.target.value;updatePreview(t,s);
    }
  });
  fe.addEventListener('input',e=>{
    if(!e.target.classList.contains('fv'))return;
    const row=e.target.closest('.flt');
    s.filters[+row.dataset.i].value=e.target.value;
    updatePreview(t,s);
  });
  fe.addEventListener('click',e=>{
    const b=e.target.closest('[data-rmf]');if(!b)return;
    s.filters.splice(+b.closest('.flt').dataset.i,1);
    drawFilters();
  });
  $('#rsf').onchange=e=>{s.sf=e.target.value;updatePreview(t,s);};
  $('#rdir').onclick=()=>{s.dir=s.dir==='asc'?'desc':'asc';renderReports($('#app'));};
  $('#svv').onclick=()=>viewModal(t,s);
  const dv=$('#dvv');
  if(dv)dv.onclick=()=>{
    const cur=views.find(v=>v.id===s.viewId);
    confirmModal({title:'Delete view',msg:`Delete the view \u201c${cur.name}\u201d?`,onYes:()=>{
      Store.deleteView(t.id,s.viewId);s.viewId='';closeN(1);renderReports($('#app'));toast('View deleted');
    }});
  };
  $('#rcsv').onclick=()=>exportCsv(t,s);
  $('#rprint').onclick=()=>printReport(t,s);
}

/* Home screen's global search: searches every table's records at once (same
   multi-field matching as a single table's search box, via recText), grouped
   by table, capped per table so one huge table can't drown out the rest.
   Picking a result opens it in recordModal, stacked over this modal like the
   reverse-link rows and the Edit-picker do. */
function globalSearchModal(){
  const PER_TABLE=8;
  openModal({
    title:'Search everywhere',
    body:`<div class="search">${ic('search',16)}<input id="gq" type="search" placeholder="Search all tables" autocomplete="off"></div><div class="meta" id="gMeta" style="padding-left:0"></div><div id="gList"></div>`,
    onMount(el){
      const q=$('#gq',el);
      function draw(){
        const query=q.value.trim().toLowerCase();
        const L=$('#gList',el);
        if(!query){$('#gMeta',el).textContent='';L.className='';L.innerHTML='<div class="empty">Type to search across every table.</div>';return;}
        const ts=Store.tables();
        let totalHits=0;
        const groups=ts.map(t=>{
          const hits=Store.records(t.id).filter(r=>recText(t,r).includes(query));
          totalHits+=hits.length;
          return {t,hits:hits.slice(0,PER_TABLE),total:hits.length};
        }).filter(g=>g.hits.length);
        $('#gMeta',el).textContent=totalHits?`${totalHits} match${totalHits===1?'':'es'}`:'';
        if(!groups.length){L.className='';L.innerHTML='<div class="empty">No matches.</div>';return;}
        L.className='';
        L.innerHTML=groups.map(g=>`<div class="viewgroup" data-tid="${g.t.id}"><h4>${esc(g.t.name)}${g.total>g.hits.length?` (showing ${g.hits.length} of ${g.total})`:''}</h4><div class="list">${g.hits.map(r=>rowHtml(g.t,r)).join('').replaceAll('data-act="editRec"','data-act="gopen"')}</div></div>`).join('');
      }
      q.addEventListener('input',draw);
      $('#gList',el).addEventListener('click',e=>{
        const b=e.target.closest('[data-act=gopen]');
        if(!b)return;
        e.stopPropagation();
        const tid=b.closest('.viewgroup').dataset.tid;
        recordModal(tid,b.dataset.id);
      });
      if(window.matchMedia&&matchMedia('(pointer:fine)').matches)q.focus();
    }
  });
}

/* Home screen's "Saved reports" quick-access: lists every saved view across
   every table, grouped by table. Picking one loads that view's fields/
   filters/sort into the report state (rs()) and jumps straight to the
   Reports screen for its table, already showing that saved report. */
function savedReportsModal(){
  const ts=Store.tables();
  const groups=ts.map(t=>({t,views:Store.views(t.id)})).filter(g=>g.views.length);
  openModal({
    title:'Saved reports',
    body:groups.length
      ?groups.map(g=>`<div class="viewgroup"><h4>${esc(g.t.name)}</h4>${g.views.map(v=>`<button class="viewrow" data-act="openView" data-tid="${g.t.id}" data-vid="${v.id}"><span class="vic">${ic('report',16)}</span><span class="m"><span class="t">${esc(v.name)}</span><span class="s">${v.fields.length} field${v.fields.length===1?'':'s'}${v.filters&&v.filters.length?' · '+v.filters.length+' filter'+(v.filters.length===1?'':'s'):''}</span></span>${ic('chev',16)}</button>`).join('')}</div>`).join('')
      :`<div class="empty"><h2>No saved reports yet</h2><p>Open a table's Reports screen, set up your fields and filters, then save it as a view.</p></div>`,
    onMount(el){
      $$('[data-act=openView]',el).forEach(b=>b.onclick=()=>{
        const tid=b.dataset.tid,vid=b.dataset.vid;
        const t=Store.table(tid);
        if(!t)return;
        const v=Store.views(tid).find(x=>x.id===vid);
        if(!v)return;
        const s=rs(t);
        s.viewId=v.id;s.fields=[...v.fields];s.filters=v.filters.map(x=>Object.assign({},x));s.sf=v.sf||'';s.dir=v.dir||'asc';
        closeN(1,()=>go({name:'reports',tableId:tid}));
      });
    }
  });
}

function viewModal(t,s){
  const cur=s.viewId?Store.views(t.id).find(v=>v.id===s.viewId):null;
  openModal({title:'Save view',
    body:`<div class="fld"><label for="vn">View name</label><input id="vn" type="text" value="${esc(cur?cur.name:'')}" placeholder="Active clients" autocomplete="off"><div class="err" id="verr"></div></div>`,
    foot:`<button class="btn" type="button" data-cancel>Cancel</button>${cur?'<button class="btn" type="button" data-new>Save as new</button>':''}<button class="btn pri" type="button" data-save>Save</button>`,
    onMount(el){
      const save=asNew=>{
        const name=$('#vn',el).value.trim();
        if(!name){$('#verr',el).textContent='Enter a name.';return;}
        const cfg={fields:[...s.fields],filters:s.filters.map(x=>Object.assign({},x)),sf:s.sf,dir:s.dir};
        const v=(cur&&!asNew)?Object.assign({},cur,cfg,{name:name}):Object.assign({id:uid(),name:name},cfg);
        Store.saveView(t.id,v);s.viewId=v.id;
        closeN(1);renderReports($('#app'));toast('View saved');
      };
      $('[data-cancel]',el).onclick=()=>closeN(1);
      $('[data-save]',el).onclick=()=>save(false);
      const nw=$('[data-new]',el);if(nw)nw.onclick=()=>save(true);
      $('#vn',el).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save(false);}});
    }
  });
}

function csvCell(x){x=String(isEmpty(x)?'':x);return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}
function viewName(t,s){const v=s.viewId?Store.views(t.id).find(x=>x.id===s.viewId):null;return v?v.name:'';}

function exportCsv(t,s){
  const r=runReport(t,s);
  const rows=[r.cols.map(f=>f.name)].concat(r.recs.map(rec=>r.cols.map(f=>fmtRec(f,rec,t,true))));
  dl(`${slug(t.name)}-${slug(viewName(t,s)||'report')}-${today()}.csv`,'\uFEFF'+rows.map(x=>x.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  toast('CSV downloaded');
}

function printReport(t,s){
  const r=runReport(t,s);
  const vn=viewName(t,s);
  const d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  $('#printArea').innerHTML=`<h1>${esc(t.name)}${vn?' \u2013 '+esc(vn):''}</h1><p>${r.recs.length} record${r.recs.length===1?'':'s'} \u00b7 Generated ${d}</p><table><thead><tr>${r.cols.map(f=>`<th>${esc(f.name)}</th>`).join('')}</tr></thead><tbody>${r.recs.map(rec=>`<tr>${r.cols.map(f=>`<td style="${(f.type==='number'||f.type==='autonum'||f.type==='formula')?'text-align:right':''}">${esc(fmtRec(f,rec,t))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  window.print();
}

/* ===== page-level actions ===== */
const ACT={
  home:()=>go({name:'home'}),
  tables:()=>go({name:'tables'}),
  openTable:el=>go({name:'table',tableId:el.dataset.id}),
  newTable:()=>tableModal(null),
  dataMenu:()=>dataModal(),
  sample:()=>loadSample(),
  addRec:()=>recordModal(route.tableId,null),
  editRec:el=>recordModal(route.tableId,el.dataset.id),
  qadd:el=>recordModal(el.dataset.id,null),
  qedit:el=>pickRecordModal(el.dataset.id),
  savedReports:()=>savedReportsModal(),
  globalSearch:()=>globalSearchModal(),
  setup:()=>tableModal(route.tableId),
  reports:()=>go({name:'reports',tableId:route.tableId}),
  backTable:()=>go({name:'table',tableId:route.tableId}),
  toggleDir:()=>{const t=Store.table(route.tableId);const v=tv(t);v.dir=v.dir==='asc'?'desc':'asc';renderTable($('#app'));},
  selStart:()=>{const t=Store.table(route.tableId);const v=tv(t);v.selMode=true;v.sel=new Set();renderTable($('#app'));},
  selCancel:()=>{const t=Store.table(route.tableId);const v=tv(t);v.selMode=false;v.sel=new Set();renderTable($('#app'));},
  selToggle:el=>{
    const t=Store.table(route.tableId),v=tv(t),id=el.dataset.id;
    if(v.sel.has(id))v.sel.delete(id);else v.sel.add(id);
    renderList();
  },
  selAll:()=>{
    const t=Store.table(route.tableId),v=tv(t);
    let recs=Store.records(t.id);
    const q=v.q.trim().toLowerCase();
    if(q)recs=recs.filter(r=>recText(t,r).includes(q));
    const allSelected=recs.length>0&&recs.every(r=>v.sel.has(r.id));
    v.sel=allSelected?new Set():new Set(recs.map(r=>r.id));
    renderList();
  },
  selSetField:()=>bulkSetFieldModal(route.tableId),
  selDelete:()=>bulkDeleteConfirm(route.tableId)
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.closest('.overlay'))return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el);
});

/* ===== start ===== */
Store.init();
try{history.replaceState({route:route,d:0},'');}catch(e){}
render();
</script>
